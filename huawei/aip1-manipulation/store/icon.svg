<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Manipulation Shield — ръчна икона (щит + лупа върху редове текст). Ръчна (БЕЗ служебния маркер) —
       генераторът я ПАЗИ и от нея прави магазинните PNG. Мотив: защита срещу манипулация в текст. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/><stop offset="0.55" stop-color="#141225"/><stop offset="1" stop-color="#0f1220"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/><stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.32" cy="0.24" r="0.9">
      <stop offset="0" stop-color="rgba(255,255,255,0.16)"/><stop offset="0.6" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#hi)"/>

  <!-- щит -->
  <path d="M512 168 l238 88 v206 c0 190 -128 302 -238 358 c-110 -56 -238 -168 -238 -358 v-206 z"
        fill="url(#shield)"/>
  <path d="M512 168 l238 88 v206 c0 190 -128 302 -238 358 c-110 -56 -238 -168 -238 -358 v-206 z"
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="8"/>

  <!-- редове „текст" вътре в щита (анализираното съдържание) -->
  <g fill="rgba(255,255,255,0.92)">
    <rect x="352" y="330" width="320" height="30" rx="15"/>
    <rect x="352" y="392" width="320" height="30" rx="15"/>
    <rect x="352" y="454" width="230" height="30" rx="15"/>
  </g>

  <!-- лупа върху текста (проверка/анализ) -->
  <g>
    <circle cx="602" cy="512" r="122" fill="rgba(15,18,32,0.35)"/>
    <circle cx="602" cy="512" r="122" fill="none" stroke="#fff" stroke-width="30"/>
    <circle cx="602" cy="512" r="122" fill="none" stroke="rgba(110,168,254,0.9)" stroke-width="12"/>
    <rect x="686" y="596" width="150" height="52" rx="26" fill="#fff" transform="rotate(45 686 596)"/>
    <!-- удивителна (риск/предупреждение) в лупата -->
    <g fill="#ef4d5a">
      <rect x="588" y="454" width="28" height="70" rx="12"/>
      <circle cx="602" cy="556" r="16"/>
    </g>
  </g>

  <text x="512" y="912" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="7" fill="rgba(255,255,255,0.96)" text-anchor="middle">pupikes</text>
</svg>
