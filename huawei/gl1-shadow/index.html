<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shadowbound</title>
<style>
  html,body{margin:0;height:100%;background:#04050a;overflow:hidden;
            font-family:Georgia,'Times New Roman',serif;color:#e9e6dc;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#04050a;touch-action:none}

  /* HUD: ниво · път · сърца */
  #hud{position:absolute;top:2.4%;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
       padding:0 3.2%;font-size:min(2.4vh,20px);letter-spacing:1px;pointer-events:none;
       text-shadow:0 0 12px rgba(120,150,220,.6)}
  #hLvl{color:#e7d9a6}
  #hud .blood{color:#e26}
  #barwrap{position:absolute;top:8%;left:50%;transform:translateX(-50%);
           width:44%;height:0.9%;min-height:5px;background:rgba(255,255,255,.12);
           border-radius:4px;overflow:hidden;pointer-events:none}
  #barwrap i{display:block;height:100%;width:0;
             background:linear-gradient(90deg,#6f86c9,#e7d9a6);box-shadow:0 0 10px #e7d9a6}
  #pathLbl{position:absolute;top:10%;left:50%;transform:translateX(-50%);
           font-size:min(1.9vh,14px);letter-spacing:1px;opacity:.7;pointer-events:none;
           text-shadow:0 0 10px rgba(0,0,0,.7)}

  /* екранни бутони — САМО за сянката */
  .btn{position:absolute;bottom:5%;width:19%;max-width:150px;padding:2.1vh 0;
       text-align:center;font-family:inherit;font-size:min(2.5vh,20px);letter-spacing:2px;
       color:#e9e6dc;background:rgba(18,22,40,.55);border:1px solid rgba(150,170,220,.35);
       border-radius:14px;backdrop-filter:blur(3px);cursor:pointer;
       box-shadow:0 0 18px rgba(0,0,0,.4);touch-action:none;transition:transform .05s,background .1s}
  .btn:active{transform:scale(.94);background:rgba(60,80,140,.6)}
  #bJump{left:4%}  #bDuck{right:4%}
  .btn small{display:block;font-size:.62em;opacity:.6;letter-spacing:1px;margin-top:.3em}

  /* съобщения (начало/край/преход) */
  #msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;padding:4%;background:radial-gradient(ellipse at 50% 42%,rgba(8,10,20,.55),rgba(3,4,9,.9));
       cursor:pointer}
  #msg.hide{display:none}
  #msg h1{font-size:min(6.6vh,52px);margin:0 0 .3em;color:#e7d9a6;letter-spacing:4px;
          text-shadow:0 0 26px rgba(216,193,122,.55)}
  #msg p{font-size:min(2.5vh,19px);max-width:64%;line-height:1.6;opacity:.92;margin:.35em 0}
  #msg .keys{font-size:min(2.1vh,16px);opacity:.7;margin-top:.2em}
  #msg .tap{margin-top:1.4em;font-size:min(2.3vh,17px);color:#cdd6ef;opacity:.8;animation:blink 1.3s infinite}
  @keyframes blink{50%{opacity:.25}}
  b{color:#e7d9a6}

  /* демо подсказка (attract mode) — прозрачен слой, докосване прекъсва */
  #demoHint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
            background:transparent;cursor:pointer}
  #demoHint.hide{display:none}
  #demoHint .badge{margin-top:5.5%;padding:.7em 1.5em;border-radius:14px;text-align:center;
                   background:rgba(10,14,28,.6);border:1px solid rgba(150,170,220,.35);backdrop-filter:blur(3px);
                   box-shadow:0 0 18px rgba(0,0,0,.4);font-size:min(2.5vh,19px);letter-spacing:1px;color:#e7d9a6;
                   text-shadow:0 0 14px rgba(216,193,122,.5)}
  #demoHint .badge small{display:block;margin-top:.45em;font-size:.72em;letter-spacing:1px;color:#cdd6ef;opacity:.85;
                         animation:blink 1.3s infinite}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="hud"><span id="hLvl">Ниво 1/18</span><span class="blood" id="hHp">♥ ♥ ♥</span></div>
  <div id="barwrap"><i id="bar"></i></div>
  <div id="pathLbl">път 0%</div>
  <div class="btn" id="bJump">СКОК<small>space / ↑</small></div>
  <div class="btn" id="bDuck">ПРИКЛЕКНИ<small>задръж ↓</small></div>
  <div id="msg"></div>
  <div id="demoHint" class="hide"><div class="badge">▶ Демо — играта се играе сама<small>Space / докосване — играй сам</small></div></div>
</div></div>

<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720;
const hLvl = document.getElementById('hLvl'), hHp = document.getElementById('hHp'),
      bar = document.getElementById('bar'), pathLbl = document.getElementById('pathLbl'),
      msg = document.getElementById('msg'), demoHint = document.getElementById('demoHint');

/* ---------- геометрия на ДВЕТЕ равнини (УНИКАЛНИЯТ ЕНДЖИН — непроменен) ---------- */
const SEAM = 362;             // шевът: линията на светлината, където сянката се закача за човека
const HUMAN_GROUND = 336;     // земята на РЕАЛНИЯ човек (горна равнина) — тук няма препятствия
const SHADOW_GROUND = 636;    // земята в равнината на СЯНКАТА (долна равнина)
const HX = 340;               // общ екранен X — човекът и сянката ВИНАГИ споделят този X (връзката)
const SH = 150, DUCK_H = 66;  // височина на сянката: изправена / приклекнала
const SW = 58;                // ширина на сянката за сблъсък
const JUMP_V = 14, GRAV = 0.55;
const PIT_CLEAR = 30;         // колко трябва да е излетяла сянката, за да мине над пропаст

/* ---------- НИВА ---------- */
const TOTAL_LEVELS = 18;
const MAX_HP = 5, START_HP = 3;
// крива на трудност + въвеждане на нови елементи през нивата
function levelCfg(n){
  const types = ['rock','beam'];
  if (n >= 3) types.push('pit');    // пропаст за прескачане с точен момент
  if (n >= 5) types.push('combo');  // нисък+висок участък (скок, после веднага клек)
  if (n >= 7) types.push('mover');  // движеща се сянка-препятствие
  return {
    n,
    len:      4200 + n*220,                       // все по-дълъг участък (повече препятствия)
    startSpd: 3.4 + (n-1)*0.13,                   // по-бърз начален ход на човека
    maxSpd:   Math.min(7.4, 5.6 + (n-1)*0.12),    // таван на скоростта (честен)
    spacing:  Math.max(300, 560 - n*16),          // все по-нагъсто (до честния праг)
    types,
    flicker:  n >= 9                              // мъждукаща светлина: нишката се къса/възстановява
  };
}

/* ---------- реални РАСТЕРНИ картинки (CC0 / обществено достояние) ---------- */
const src = { human:'assets/human.png', sky:'assets/sky.jpg', wall:'assets/wall.jpg',
              ground:'assets/ground.jpg', rock:'assets/rock.jpg', beam:'assets/beam.jpg',
              mover:'assets/mover.jpg' };
const A = {}; let loaded = 0; const need = Object.keys(src);
need.forEach(k => { const im = new Image(); im.onload = () => loaded++; im.onerror = () => loaded++; im.src = src[k]; A[k] = im; });

/* сянката = потъмнен/сплеснат вариант на човека, изграден в OFFSCREEN canvas */
let shadowImg = null;
function buildShadow() {
  const im = A.human; if (!im.width) return;
  const oc = document.createElement('canvas'); oc.width = im.width; oc.height = im.height;
  const og = oc.getContext('2d');
  og.drawImage(im, 0, 0);
  og.globalCompositeOperation = 'source-in';   // запазваме силуета, но го правим черен
  og.fillStyle = '#000'; og.fillRect(0, 0, oc.width, oc.height);
  shadowImg = oc;
}

/* ---------- състояние ---------- */
let state = 'ready';           // ready | demo | play | over | levelclear | win
let currentLevel = 1, cfg = levelCfg(1);
let goal = cfg.len;
let worldX = 0, spd = 0, t = 0, bestLevel = 0;
let obstacles = [], blood = [], sparks = [], shake = 0, tetherHurt = 0, flashRed = 0;
let flick = 0;                 // 0..1 колко „угасена" е светлината в момента
let overMsgTimer = null;

// сянката (единственото, което ИГРАЧЪТ управлява)
const sh = { lift:0, vy:0, ground:true, ducking:false };
// човекът (само СТРАДА — не се управлява)
const man = { hp:START_HP, stagger:0, tilt:0, dead:false, fall:0, phase:0 };

/* нова игра от Ниво 1 */
function newGame() {
  if (overMsgTimer) { clearTimeout(overMsgTimer); overMsgTimer = null; }
  man.hp = START_HP;
  loadLevel(1, false);
  state = 'ready';
  showMsg('СЯНКАТА',
    'Ти водиш <b>само сянката</b> — своя страничен, друг живот долу.<br>'
   +'Истинският човек горе върви <b>напред сам</b>, пътят пред него е чист.<br>'
   +'Но всички препятствия са в <b>равнината на сянката</b>. Спъне ли се сянката —<br>'
   +'страда <b>човекът</b>: залита, кърви и накрая умира.',
    'СКОК прескача камъните и пропастите долу · ПРИКЛЕКНИ минава под гредите.<br>'
   +'Преведи сянката през <b>'+TOTAL_LEVELS+' нива</b> до финалната светлина.',
    'Натисни / докосни за начало');
}

/* зареждане на ниво n; heal=true → възстановяваме едно сърце разумно между нива */
function loadLevel(n, heal) {
  if (overMsgTimer) { clearTimeout(overMsgTimer); overMsgTimer = null; }
  currentLevel = n;
  cfg = levelCfg(n);
  goal = cfg.len;
  if (heal) man.hp = Math.min(MAX_HP, man.hp + 1);
  worldX = 0; spd = cfg.startSpd; flick = 0;
  obstacles = []; blood = []; sparks = []; shake = 0; tetherHurt = 0; flashRed = 0;
  sh.lift = 0; sh.vy = 0; sh.ground = true; sh.ducking = false;
  man.stagger = 0; man.tilt = 0; man.dead = false; man.fall = 0; man.phase = 0;
  buildTrack(cfg);
  bar.style.width = '0%';
  updateHud();
}

/* път на ниво: препятствия САМО в равнината на сянката, тип според отключеното за нивото */
// честен праг: между скок-препятствие и клек-препятствие сянката ВИНАГИ успява да се приземи
function gap(){
  const air = 2*JUMP_V/GRAV;                      // кадри във въздуха при скок (~51)
  const safe = cfg.maxSpd * (air*0.62) + 155;     // мин. разстояние между центровете
  return Math.max(cfg.spacing, safe) + Math.random()*130;
}
function pushRock(x, mover){
  const o = { x, type:'rock', w: 46 + Math.random()*30, h: 52 + Math.random()*40, done:false };
  if (mover) { o.mover = true; o.h = 40 + Math.random()*22;   // по-ниска, честна за прескачане въпреки движението
                 o.mamp = 26 + Math.random()*34; o.mspd = 0.02 + Math.random()*0.012; o.mph = Math.random()*6.28; }
  obstacles.push(o);
}
function pushBeam(x){ obstacles.push({ x, type:'beam', w: 150 + Math.random()*70, h: 145 + Math.random()*40, done:false }); }
function pushPit(x){ obstacles.push({ x, type:'pit', w: 78 + Math.random()*46, h: 0, done:false }); } // ширина < обхвата на скока

function buildTrack(cfg) {
  obstacles = [];
  const types = cfg.types;
  let x = 1400, guard = 0;
  while (x < cfg.len - 850 && guard++ < 500) {
    const pick = types[(Math.random()*types.length)|0];
    if (pick === 'rock')       { pushRock(x);        x += gap(); }
    else if (pick === 'beam')  { pushBeam(x);        x += gap(); }
    else if (pick === 'pit')   { pushPit(x);         x += gap() + 60; }
    else if (pick === 'mover') { pushRock(x, true);  x += gap() + 40; }
    else if (pick === 'combo') { pushBeam(x); x += 300 + Math.random()*90; pushRock(x); x += gap() + 60; } // висок→нисък: клек, после веднага скок
  }
}

/* ефективен световен X (движещите се препятствия се люлеят) */
function obX(o){ return o.mover ? o.x + Math.sin(t*o.mspd + o.mph)*o.mamp : o.x; }

/* ---------- вход: САМО за сянката ---------- */
function jump() {
  if (state !== 'play' && state !== 'demo') return;
  if (sh.ground) { sh.vy = JUMP_V; sh.ground = false; sh.ducking = false; }
}
function setDuck(on) { if (state === 'play' || state === 'demo') sh.ducking = on && sh.ground; }

/* --- ДЕМО (attract mode): играта се играе сама след интрото, при всяко пускане --- */
function startDemo() {
  loadLevel(1, false);          // винаги показваме Ниво 1
  man.hp = START_HP;
  state = 'demo';
  hideMsg();
  demoHint.className = '';
}
function startRealGame() {      // прекъсване на демото → истинска игра от Ниво 1 (reset)
  demoHint.className = 'hide';
  man.hp = START_HP;
  loadLevel(1, false);
  state = 'play';
  hideMsg();
}

function startOrRestart() {
  if (state === 'ready')            { startDemo(); }                                  // интро → демо
  else if (state === 'demo')        { startRealGame(); }                              // демо → истинска игра
  else if (state === 'levelclear')  { loadLevel(currentLevel + 1, true); state = 'play'; hideMsg(); }
  else if (state === 'over')        { man.hp = START_HP; loadLevel(currentLevel, false); state = 'play'; hideMsg(); }
  else if (state === 'win')         { newGame(); }
}
// докосване/клик върху демо слоя → истинска игра
demoHint.addEventListener('pointerdown', e => { e.preventDefault(); startOrRestart(); });

addEventListener('keydown', e => {
  if (e.repeat) { if (e.code==='ArrowDown'||e.code==='KeyS') setDuck(true); return; }
  if (e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') {
    e.preventDefault();
    if (state==='play') jump(); else startOrRestart();
  } else if (e.code==='ArrowDown'||e.code==='KeyS') {
    e.preventDefault(); if (state==='play') setDuck(true); else startOrRestart();
  }
});
addEventListener('keyup', e => { if (e.code==='ArrowDown'||e.code==='KeyS') setDuck(false); });

// начало/рестарт през оверлея
msg.addEventListener('pointerdown', e => { e.preventDefault(); startOrRestart(); });

// екранни бутони (само за сянката)
const bJump = document.getElementById('bJump'), bDuck = document.getElementById('bDuck');
bJump.addEventListener('pointerdown', e => { e.preventDefault(); if (state==='play') jump(); else startOrRestart(); });
function duckDown(e){ e.preventDefault(); if (state==='play') setDuck(true); else startOrRestart(); }
function duckUp(e){ e.preventDefault(); setDuck(false); }
bDuck.addEventListener('pointerdown', duckDown);
bDuck.addEventListener('pointerup', duckUp);
bDuck.addEventListener('pointerleave', duckUp);
bDuck.addEventListener('pointercancel', duckUp);

/* ---------- сблъсък: провалът на сянката наранява ЧОВЕКА ---------- */
function shadowTop() { return SHADOW_GROUND - sh.lift - (sh.ducking ? DUCK_H : SH); }
function shadowBottom() { return SHADOW_GROUND - sh.lift; }

function collides(o) {
  if (o.type === 'rock') {                       // камък на земята → трябва СКОК
    return shadowBottom() > SHADOW_GROUND - o.h + 6;
  } else if (o.type === 'beam') {                 // надвиснала греда → трябва ПРИКЛЕКВАНЕ
    const beamBottom = SEAM + o.h;
    return shadowTop() < beamBottom - 6;
  }
  return false;
}

function hurtMan(o) {
  man.hp--;
  man.stagger = 34;                 // залитане
  man.tilt = (o.type==='beam' ? -0.42 : 0.5);
  shake = 16; tetherHurt = 1; flashRed = 1;
  spd = Math.max(2.6, spd * 0.78);  // ударът спъва хода напред
  spawnBlood(HX, HUMAN_GROUND - 78, 26);           // кръв от ЧОВЕКА (горе)
  if (man.hp <= 0) die();
  else updateHud();
}
function clearOb() { sparks.push({ x:HX, y:shadowTop()+8, life:16 }); }

function spawnBlood(x, y, n) {
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 1.5 + Math.random()*4.5;
    blood.push({ x, y, vx:Math.cos(a)*s + 1.4, vy:Math.sin(a)*s - 2.4,
                 r:1.5+Math.random()*3, life:40+Math.random()*30 });
  }
}

function die() {
  man.dead = true; state = 'over';
  spawnBlood(HX, HUMAN_GROUND - 60, 60);
  if (currentLevel > bestLevel) bestLevel = currentLevel;
  updateHud();
  const lvl = currentLevel;
  overMsgTimer = setTimeout(() => showMsg('ЧОВЕКЪТ ПАДНА',
    'Сянката ти не се справи на <b>Ниво '+lvl+'</b> — и <b>ти</b> плати за нея.<br>'
   +'Кръвта отне остатъка от пътя.',
    'Всяка спъната сянка е рана горе, в реалния живот.',
    'Натисни, за да опиташ Ниво '+lvl+' отново'), 650);
}

function levelClear() {
  if (currentLevel > bestLevel) bestLevel = currentLevel;
  if (currentLevel >= TOTAL_LEVELS) { finalWin(); return; }
  state = 'levelclear';
  const nxt = currentLevel + 1;
  const healed = man.hp < MAX_HP ? '+1 сърце възстановено. ' : '';
  showMsg('НИВО '+currentLevel+' ПРЕМИНА',
    'Сянката премина целия участък — човекът горе <b>оцеля</b>.<br>'+healed
   +'Следва по-труден път.',
    'Ниво '+nxt+' от '+TOTAL_LEVELS+' · '+intro(nxt),
    'Натисни за Ниво '+nxt);
}

/* кратко въведение какво ново носи нивото */
function intro(n){
  if (n === 3) return 'ново: <b>пропасти</b> — скок с точен момент.';
  if (n === 5) return 'ново: <b>двойни</b> участъци — скок, после веднага клек.';
  if (n === 7) return 'ново: <b>движещи се</b> сенки-препятствия.';
  if (n === 9) return 'ново: <b>мъждукаща светлина</b> — нишката ту се къса, ту се възстановява.';
  return 'по-бърз ход и по-нагъсто.';
}

function finalWin() {
  state = 'win';
  if (TOTAL_LEVELS > bestLevel) bestLevel = TOTAL_LEVELS;
  showMsg('СТИГНАХТЕ СВЕТЛИНАТА',
    'През всичките <b>'+TOTAL_LEVELS+'</b> нива сянката премина всяко препятствие долу —<br>'
   +'и затова човекът горе <b>оцеля</b> целия път.<br>'
   +'Двата живота се събраха при светлината, <b>живи</b>.',
    'Води сянката добре и реалният ти оцелява.',
    'Натисни, за да тръгнеш отново');
}

/* ---------- ъпдейт ---------- */
function update() {
  t++;
  if (flashRed > 0) flashRed -= 0.05;
  if (tetherHurt > 0) tetherHurt -= 0.04;
  if (shake > 0) shake *= 0.86;
  // кръв пада
  for (const p of blood){ p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--; }
  blood = blood.filter(p => p.life > 0 && p.y < H+20);
  for (const s of sparks) s.life--;
  sparks = sparks.filter(s => s.life > 0);

  // мъждукаща светлина (само за нивата, които я имат)
  if (cfg.flicker && state === 'play') {
    const f = Math.sin(t*0.031) + Math.sin(t*0.0173 + 1.3);
    flick = f < -0.55 ? Math.min(1, (-0.55 - f)*2.4) : Math.max(0, flick - 0.08);
  } else if (state !== 'play') { /* задържаме */ } else flick = Math.max(0, flick - 0.12);

  const playing = (state === 'play' || state === 'demo');
  if (!playing) {
    if (autoOn) autoAdvance();
    if (man.dead && man.fall < 1) man.fall = Math.min(1, man.fall + 0.05); // сгромолясване
    return;
  }
  if (state === 'demo') autoInput();     // демото играе само
  else if (autoOn) autoDecide();

  // ходът НАПРЕД на човека движи света; сянката е заключена за същия X
  spd = Math.min(spd + 0.0009, cfg.maxSpd);
  if (man.stagger > 0) { man.stagger--; man.tilt *= 0.9; }
  man.phase += spd * 0.045;
  worldX += spd;

  // вертикална физика на СЯНКАТА (единственото под наш контрол)
  if (!sh.ground) {
    sh.lift += sh.vy; sh.vy -= GRAV;
    if (sh.lift <= 0) { sh.lift = 0; sh.vy = 0; sh.ground = true; }
  }

  // сблъсъци в равнината на сянката
  const reach = SW/2;
  for (const o of obstacles) {
    if (o.done) continue;
    const sx = obX(o) - worldX;                 // екранен X (център) на препятствието
    if (o.type === 'pit') {                     // пропаст: трябва да си във въздуха над нея
      if (Math.abs(sx - HX) < o.w/2) {
        if (sh.lift < PIT_CLEAR) { o.done = true; if (state === 'demo') clearOb(); else hurtMan(o); }
      } else if (sx < HX - o.w/2) { o.done = true; clearOb(); }
      continue;
    }
    const dx = Math.abs(sx - HX);
    if (dx < reach + o.w/2) {                    // застъпване сега
      if (collides(o)) { o.done = true; if (state === 'demo') clearOb(); else hurtMan(o); }  // демо: без реална щета
    } else if (sx < HX - (reach + o.w/2)) {      // подминато чисто
      o.done = true; clearOb();
    }
  }

  // цел
  const prog = Math.min(worldX/(goal - W), 1);
  bar.style.width = (prog*100).toFixed(1) + '%';
  updateHud();
  if (prog >= 1) { if (state === 'demo') loadLevel(1, false); else levelClear(); }  // демото зацикля
}

function updateHud() {
  const p = Math.min(worldX/(goal - W)*100, 100);
  hLvl.textContent = 'Ниво ' + currentLevel + '/' + TOTAL_LEVELS + (bestLevel ? '  ·  рекорд ' + bestLevel : '');
  pathLbl.textContent = 'път ' + p.toFixed(0) + '%';
  hHp.innerHTML = ('♥ '.repeat(Math.max(0,man.hp)) + '♡ '.repeat(Math.max(0,MAX_HP-man.hp))).trim();
}

/* ---------- рисуване ---------- */
function drawHuman() {
  const im = A.human; if (!im.width) return;
  const h = 150, w = im.width / im.height * h;
  const bob = Math.abs(Math.sin(man.phase)) * 5;
  const lean = Math.sin(man.phase*2) * 0.035 + man.tilt;
  ctx.save();
  ctx.translate(HX, HUMAN_GROUND - man.fall*8);
  if (man.dead) ctx.rotate(man.fall * 1.35);   // сгромолясва напред
  else ctx.rotate(lean);
  // мека топла светлина зад човека
  const gl = ctx.createRadialGradient(0,-h*0.55,4,0,-h*0.55,h*0.9);
  gl.addColorStop(0,'rgba(230,210,150,0.16)'); gl.addColorStop(1,'rgba(230,210,150,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0,-h*0.55,h*0.9,0,7); ctx.fill();
  ctx.drawImage(im, -w/2, -h + bob, w, h - bob);
  ctx.restore();
}

function drawShadow() {
  if (!shadowImg) return;
  const dh = sh.ducking ? DUCK_H : SH;
  const w = shadowImg.width / shadowImg.height * SH; // ширина по изправената височина
  const feetY = SHADOW_GROUND - sh.lift;
  // контактно петно
  ctx.save();
  ctx.globalAlpha = 0.35 * (1 - Math.min(sh.lift/140,0.9));
  ctx.fillStyle = '#000'; ctx.beginPath();
  ctx.ellipse(HX, SHADOW_GROUND+4, w*0.6, 9, 0, 0, 7); ctx.fill();
  ctx.restore();
  // самата сянка: сплесната + наклонена (сякаш хвърлена от ниска светлина)
  const skew = 0.34 + Math.sin(man.phase) * 0.05;
  ctx.save();
  ctx.globalAlpha = 0.82;
  ctx.translate(HX, feetY);
  ctx.transform(1, 0, -skew, 1, 0, 0);           // хоризонтален наклон
  ctx.drawImage(shadowImg, -w/2, -dh, w, dh);
  ctx.restore();
}

function drawTether() {
  // ВИДИМАТА ВРЪЗКА: нишка светлина от стъпалата на човека надолу към главата на сянката
  const topY = HUMAN_GROUND - 4;
  const botY = shadowTop();
  const hurt = Math.max(0, tetherHurt);
  const broken = flick > 0.45;                    // мъждукащата светлина къса нишката
  ctx.save();
  ctx.lineWidth = 2 + hurt*3;
  const g = ctx.createLinearGradient(0, topY, 0, botY);
  if (hurt > 0.02) {
    g.addColorStop(0, 'rgba(255,60,80,'+(0.5+0.4*hurt)+')');
    g.addColorStop(1, 'rgba(160,20,40,'+(0.2+0.5*hurt)+')');
  } else {
    g.addColorStop(0, 'rgba(230,210,150,0.5)');
    g.addColorStop(1, 'rgba(120,150,220,0.28)');
  }
  ctx.strokeStyle = g;
  if (broken) {
    // нишката е скъсана: къси трепкащи парчета + пролука
    ctx.globalAlpha = 0.5;
    ctx.setLineDash([10, 16]);
    ctx.lineDashOffset = (t*3) % 26;
    ctx.beginPath(); ctx.moveTo(HX, topY); ctx.lineTo(HX, botY); ctx.stroke();
    ctx.setLineDash([]);
    // искра там, където светлината се къса
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = 'rgba(235,215,150,0.8)';
    ctx.beginPath(); ctx.arc(HX, (topY+botY)/2, 4, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(HX, topY); ctx.lineTo(HX, botY); ctx.stroke();
    // импулс на болка, който пътува НАГОРЕ (от сянката към човека)
    if (hurt > 0.02) {
      const py = botY + (topY - botY) * (1 - hurt);
      ctx.fillStyle = 'rgba(255,90,110,'+hurt+')';
      ctx.beginPath(); ctx.arc(HX, py, 6+hurt*5, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

function drawObstacle(o) {
  const sx = obX(o) - worldX;
  if (sx < -320 || sx > W+320) return;
  const x0 = sx - o.w/2;
  if (o.type === 'pit') {                          // ПРОПАСТ в земята → прескочи
    const top = SHADOW_GROUND;
    ctx.fillStyle = '#000'; ctx.fillRect(x0, top, o.w, H - top);
    const cg = ctx.createLinearGradient(0, top, 0, H);
    cg.addColorStop(0,'rgba(60,70,100,0.35)'); cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = cg; ctx.fillRect(x0, top, o.w, H - top);
    // опасни ръбове от двете страни
    for (const ex of [x0, x0+o.w]) {
      const dg = ctx.createLinearGradient(ex-8, 0, ex+8, 0);
      dg.addColorStop(0,'rgba(226,60,70,0)'); dg.addColorStop(.5,'rgba(226,60,70,0.5)'); dg.addColorStop(1,'rgba(226,60,70,0)');
      ctx.fillStyle = dg; ctx.fillRect(ex-8, top-4, 16, 30);
    }
    return;
  }
  if (o.type === 'rock') {                         // нисък камък на земята → ПРЕСКОЧИ
    const top = SHADOW_GROUND - o.h;
    const img = o.mover ? (A.mover.width ? A.mover : A.rock) : A.rock;
    if (img.width) ctx.drawImage(img, x0, top, o.w, o.h);
    ctx.fillStyle = o.mover ? 'rgba(4,6,16,0.42)' : 'rgba(2,3,7,0.5)'; ctx.fillRect(x0, top, o.w, o.h);
    if (o.mover) { // ореол, че се движи
      ctx.save(); ctx.globalAlpha = 0.5;
      const mg = ctx.createRadialGradient(sx, top+o.h/2, 2, sx, top+o.h/2, o.w);
      mg.addColorStop(0,'rgba(120,150,220,0.4)'); mg.addColorStop(1,'rgba(120,150,220,0)');
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(sx, top+o.h/2, o.w, 0, 7); ctx.fill(); ctx.restore();
    }
    const dg = ctx.createLinearGradient(0, top-14, 0, top+8);
    dg.addColorStop(0,'rgba(226,60,70,0)'); dg.addColorStop(1,'rgba(226,60,70,0.5)');
    ctx.fillStyle = dg; ctx.fillRect(x0, top-14, o.w, 22);
    ctx.strokeStyle = 'rgba(120,140,190,0.22)'; ctx.lineWidth=1; ctx.strokeRect(x0, top, o.w, o.h);
  } else {                                          // надвиснала греда от тавана → ПРИКЛЕКНИ
    const bot = SEAM + o.h;
    if (A.beam.width) ctx.drawImage(A.beam, x0, SEAM, o.w, o.h);
    ctx.fillStyle = 'rgba(2,3,7,0.5)'; ctx.fillRect(x0, SEAM, o.w, o.h);
    const dg = ctx.createLinearGradient(0, bot-8, 0, bot+16);
    dg.addColorStop(0,'rgba(226,60,70,0.5)'); dg.addColorStop(1,'rgba(226,60,70,0)');
    ctx.fillStyle = dg; ctx.fillRect(x0, bot-8, o.w, 24);
    ctx.strokeStyle = 'rgba(120,140,190,0.2)'; ctx.lineWidth=1; ctx.strokeRect(x0, SEAM, o.w, o.h);
  }
}

function draw() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  const sx = shake>0.4 ? (Math.random()-0.5)*shake : 0;
  const sy = shake>0.4 ? (Math.random()-0.5)*shake : 0;
  ctx.translate(sx, sy);

  // ---- ГОРНА равнина: реалният свят (чист път, здрачно небе) ----
  if (A.sky.width) ctx.drawImage(A.sky, 0, 0, W, SEAM); else { ctx.fillStyle='#0d1226'; ctx.fillRect(0,0,W,SEAM); }
  const gy = HUMAN_GROUND;
  if (A.ground.width) {
    const off = (worldX*0.6) % A.ground.width;
    for (let x=-off; x<W; x+=A.ground.width) ctx.drawImage(A.ground, x, gy, A.ground.width, SEAM-gy);
  }
  ctx.fillStyle = 'rgba(4,5,11,0.35)'; ctx.fillRect(0, gy, W, SEAM-gy);

  // ---- ДОЛНА равнина: светът на сянката (стена/настилка) ----
  if (A.wall.width) ctx.drawImage(A.wall, 0, SEAM, W, H-SEAM); else { ctx.fillStyle='#08090d'; ctx.fillRect(0,SEAM,W,H-SEAM); }
  ctx.save(); ctx.globalAlpha = 0.5;
  ctx.strokeStyle = 'rgba(120,140,180,0.10)'; ctx.lineWidth = 2;
  const step = 150, soff = (worldX) % step;
  for (let x=-soff; x<W; x+=step){ ctx.beginPath(); ctx.moveTo(x, SHADOW_GROUND); ctx.lineTo(x-40, H); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(150,170,220,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, SHADOW_GROUND); ctx.lineTo(W, SHADOW_GROUND); ctx.stroke();

  // ---- шевът: линията на светлината между двата свята ----
  const sg = ctx.createLinearGradient(0, SEAM-26, 0, SEAM+26);
  sg.addColorStop(0,'rgba(216,193,122,0)'); sg.addColorStop(.5,'rgba(235,215,150,'+(0.6*(1-flick*0.8))+')'); sg.addColorStop(1,'rgba(216,193,122,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, SEAM-26, W, 52);

  // целта: светеща порта в дъното на пътя (в двете равнини)
  const gx = (goal - W) - worldX + HX;
  if (gx < W+140 && gx > -140) {
    const grad = ctx.createLinearGradient(gx-14,0,gx+80,0);
    grad.addColorStop(0,'rgba(235,215,150,0)'); grad.addColorStop(.5,'rgba(235,215,150,.9)'); grad.addColorStop(1,'rgba(235,215,150,0)');
    ctx.fillStyle = grad; ctx.fillRect(gx-14, 40, 94, H-80);
  }

  // препятствия (само долу)
  for (const o of obstacles) drawObstacle(o);

  // връзка → сянка → човек
  drawTether();
  drawShadow();
  drawHuman();

  // искри при чисто преминаване
  for (const s of sparks) {
    ctx.globalAlpha = s.life/16; ctx.fillStyle = '#e7d9a6';
    ctx.beginPath(); ctx.arc(s.x + (16-s.life)*1.5, s.y, 3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // кръв (по човека и надолу)
  for (const p of blood) {
    ctx.globalAlpha = Math.min(1, p.life/40);
    ctx.fillStyle = '#b1121f';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // мъждукаща светлина: цялата сцена потъмнява на пулсове
  if (flick > 0.02) {
    ctx.fillStyle = 'rgba(2,3,8,'+(flick*0.6)+')';
    ctx.fillRect(-40,-40,W+80,H+80);
  }

  // червено проблясване при удар
  if (flashRed > 0.02) {
    ctx.fillStyle = 'rgba(150,10,25,'+(flashRed*0.4)+')';
    ctx.fillRect(-40,-40,W+80,H+80);
  }

  // винетка
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.82);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(-40,-40,W+80,H+80);
}

/* ---------- съобщения ---------- */
function showMsg(h, p, keys, tap) {
  msg.className = '';
  msg.innerHTML = '<h1>'+h+'</h1><p>'+p+'</p>'
                + (keys ? '<p class="keys">'+keys+'</p>' : '')
                + (tap ? '<p class="tap">'+tap+'</p>' : '');
}
function hideMsg() { msg.className = 'hide'; }

/* ---------- цикъл ---------- */
function loop() { update(); draw(); requestAnimationFrame(loop); }
function boot() {
  if (loaded < need.length) { setTimeout(boot, 60); return; }
  buildShadow();
  newGame();
  loop();
}
boot();

/* --- автопилот (само за автоматичния тест; в игра стои изключен) --- */
let autoOn = false;
function autoDecide() {
  // избираме най-близкото препятствие, чието тяло още не е подминало сянката
  let best = null;
  for (const o of obstacles) {
    if (o.done) continue;
    const sx = obX(o) - worldX;
    if (sx + o.w/2 > HX - SW/2 && (!best || sx < best.sx)) best = { o, sx };
  }
  if (!best) { setDuck(false); return; }
  const o = best.o, sx = best.sx, lead = sx - HX;
  if (o.type === 'beam') {
    setDuck((sx - o.w/2) < HX + 150);
  } else if (o.type === 'pit') {
    setDuck(false);
    // излитаме точно при близкия ръб, за да покрие цялата дъга пролуката (не по-рано — губи се обхват)
    if ((sx - o.w/2 - HX) < spd*6 && sh.ground) jump();
  } else { // rock или mover
    setDuck(false);
    const trig = o.mover ? spd*26 : spd*24;
    if (lead < trig && lead > -o.w && sh.ground) jump();
  }
}
function autoAdvance() { if (state === 'levelclear' || state === 'ready') startOrRestart(); }

/* мозъкът на ДЕМОТО: гледа най-близкото препятствие и действа в точния момент (без щета) */
function autoInput() { autoDecide(); }

// диагностика + синхронен симулатор за теста
function obCounts() {
  const c = { rock:0, beam:0, pit:0, mover:0 };
  for (const o of obstacles) { if (o.mover) c.mover++; else c[o.type]++; }
  return c;
}
window.__shadow = {
  get state(){return state;}, get hp(){return man.hp;}, get maxHp(){return MAX_HP;},
  get level(){return currentLevel;}, get total(){return TOTAL_LEVELS;},
  get prog(){return worldX/(goal-W);}, get loaded(){return loaded;}, need:need.length,
  get bestLevel(){return bestLevel;}, get spd(){return spd;}, get bloodCount(){return blood.length;},
  jump, setDuck, tap:startOrRestart, auto:(v)=>{autoOn=v;},
  sim:(n)=>{ for(let i=0;i<n;i++) update(); },
  cfgOf:(n)=>{ const c=levelCfg(n); return {n, len:c.len, startSpd:+c.startSpd.toFixed(2), maxSpd:+c.maxSpd.toFixed(2),
              spacing:c.spacing, types:c.types.slice(), flicker:c.flicker}; },
  counts:obCounts,
  imgs:()=>need.map(k=>({k, w:A[k].naturalWidth})),
  hasShadow:()=>!!shadowImg,
  dbg:()=>{let b=null;for(const o of obstacles){if(o.done)continue;const sx=obX(o)-worldX;if(sx>HX-40&&(!b||sx<b.sx))b={o,sx};}
          return {lvl:currentLevel,lift:+sh.lift.toFixed(0),duck:sh.ducking,grnd:sh.ground,spd:+spd.toFixed(1),flick:+flick.toFixed(2),
                  near:b?{type:b.o.mover?'mover':b.o.type,lead:+(b.sx-HX).toFixed(0),w:+b.o.w.toFixed(0),h:+b.o.h.toFixed(0)}:null};}
};
