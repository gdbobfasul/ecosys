<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--pupikes-custom-icon: ръчен дизайн (графика + летящи £ ₺ ₿) — НЕ регенерирай-->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.32" cy="0.24" r="0.9">
      <stop offset="0" stop-color="rgba(255,255,255,0.20)"/><stop offset="0.6" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#g)"/>
  <rect width="1024" height="1024" fill="url(#hi)"/>
  <rect x="236" y="196" width="552" height="470" rx="120" fill="#fff"/>
  <circle cx="742" cy="250" r="46" fill="#34d399"/>
  <!-- Графика (възходяща линия със стрелка) в средата -->
  <g fill="none" stroke="#047857" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M406 512 L 470 456 L 522 484 L 596 404"/>
  </g>
  <path d="M596 404 l52 -12 l-2 52 z" fill="#047857"/>
  <g fill="#10b981"><circle cx="406" cy="512" r="11"/><circle cx="470" cy="456" r="11"/><circle cx="522" cy="484" r="11"/><circle cx="596" cy="404" r="11"/></g>
  <!-- Хвърчащи валутни знаци: британска лира £, турска лира ₺, биткойн ₿ -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <text x="352" y="360" font-size="108" fill="#059669" transform="rotate(-13 352 328)">£</text>
    <text x="676" y="346" font-size="104" fill="#047857" transform="rotate(14 676 312)">₿</text>
    <text x="510" y="626" font-size="112" fill="#059669" transform="rotate(-8 510 590)">₺</text>
  </g>
  <text x="512" y="892" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="118" font-weight="700" letter-spacing="7" fill="rgba(255,255,255,0.96)" text-anchor="middle">pupikes</text>
</svg>
