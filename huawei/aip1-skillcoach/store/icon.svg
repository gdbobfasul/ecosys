<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Skill Coach — ръчна икона: изкачваща се крива на умението + степенки (учене чрез правене) + мишена (целта). Ръчна (без служебния маркер) - генераторът я ПАЗИ и от нея прави магазинните PNG. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1e6e"/><stop offset="0.5" stop-color="#312e81"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#818cf8"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.3" cy="0.22" r="0.9">
      <stop offset="0" stop-color="rgba(255,255,255,0.20)"/><stop offset="0.6" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(240,171,252,0.55)"/><stop offset="1" stop-color="rgba(240,171,252,0)"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#hi)"/>

  <!-- степенки на практиката (учене чрез правене) -->
  <g fill="rgba(255,255,255,0.10)">
    <rect x="196" y="720" width="150" height="110" rx="20"/>
    <rect x="196" y="600" width="270" height="110" rx="20"/>
    <rect x="196" y="480" width="390" height="110" rx="20"/>
  </g>

  <!-- изкачваща се крива на уменич­ето -->
  <path d="M210 792 C 380 760, 470 640, 560 500 S 760 300, 852 236"
        fill="none" stroke="url(#curve)" stroke-width="46" stroke-linecap="round"/>

  <!-- милестоуни по кривата -->
  <g fill="#0f1027">
    <circle cx="210" cy="792" r="30"/><circle cx="470" cy="560" r="30"/><circle cx="620" cy="430" r="30"/>
  </g>
  <g fill="#ffffff">
    <circle cx="210" cy="792" r="18"/><circle cx="470" cy="560" r="18"/><circle cx="620" cy="430" r="18"/>
  </g>

  <!-- мишена (целта) в горния десен край на кривата -->
  <circle cx="822" cy="262" r="180" fill="url(#tglow)"/>
  <circle cx="822" cy="262" r="120" fill="none" stroke="#f0abfc" stroke-width="26"/>
  <circle cx="822" cy="262" r="72" fill="none" stroke="#ffffff" stroke-width="24"/>
  <circle cx="822" cy="262" r="24" fill="#f0abfc"/>
</svg>
