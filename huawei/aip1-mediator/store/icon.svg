<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ръчна икона за Fair Mediator (мотив: везна на справедливостта + две ръце/помирение). Ръчна (не е генерирана); gen-app-icons я запазва и рендерира магазинните икони от нея. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.32" cy="0.24" r="0.9">
      <stop offset="0" stop-color="rgba(255,255,255,0.20)"/><stop offset="0.6" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#g)"/>
  <rect width="1024" height="1024" fill="url(#hi)"/>
  <rect x="236" y="196" width="552" height="470" rx="120" fill="#fff"/>
  <circle cx="742" cy="250" r="46" fill="#34d399"/>
  <!-- Везна на справедливостта: централен стълб, греда с две блюда, основа -->
  <g fill="none" stroke="#0f766e" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- централен стълб -->
    <line x1="512" y1="286" x2="512" y2="576"/>
    <!-- греда -->
    <line x1="360" y1="330" x2="664" y2="330"/>
    <!-- вериги на лявото блюдо -->
    <line x1="360" y1="330" x2="316" y2="452"/>
    <line x1="360" y1="330" x2="404" y2="452"/>
    <!-- вериги на дясното блюдо -->
    <line x1="664" y1="330" x2="620" y2="452"/>
    <line x1="664" y1="330" x2="708" y2="452"/>
    <!-- ляво блюдо (плитка купа) -->
    <path d="M300 452 a60 42 0 0 0 120 0"/>
    <!-- дясно блюдо (плитка купа) -->
    <path d="M604 452 a60 42 0 0 0 120 0"/>
    <!-- основа -->
    <line x1="430" y1="596" x2="594" y2="596"/>
  </g>
  <!-- фулкрум възел -->
  <circle cx="512" cy="316" r="26" fill="#0f766e"/>
  <text x="512" y="892" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="118" font-weight="700" letter-spacing="7" fill="rgba(255,255,255,0.96)" text-anchor="middle">pupikes</text>
</svg>
