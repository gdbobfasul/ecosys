<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Сезоните — походът до кулата</title>
<style>
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden;
    font-family:Georgia,'Times New Roman',serif;color:#eae4d4;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh;display:block;background:#05070c;touch-action:none;
    box-shadow:0 0 60px rgba(0,0,0,.8)}
  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;pointer-events:none;padding:12px 20px 0;
    display:flex;justify-content:space-between;align-items:flex-start;font-size:16px;line-height:1.34;
    text-shadow:0 2px 10px #000;z-index:5}
  #hud .left{max-width:46%}
  #hud .lvl{font-size:15px;letter-spacing:1px;color:#ffe4ad;text-shadow:0 0 14px #d8901f}
  #hud .lvl b{font-size:20px}
  #hud .goal{margin-top:3px;font-size:14px;opacity:.92}
  #hud .goal b{color:#ffd98a}
  #hud .season{text-align:right;max-width:52%}
  #hud .season .big{font-size:22px;letter-spacing:1px}
  #hud .season .need{font-size:13.5px;opacity:.94;margin-top:2px}
  #hud .season .stat{font-size:13.5px;margin-top:4px;opacity:.96}
  #hud .stat .sw{color:#bfe3ff}#hud .stat .sw.low{color:#ff9a6a}
  #hud .stat .hp{color:#ff9db0;letter-spacing:2px}
  #hud small{opacity:.72;font-size:12.5px}
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(560px,72vw);height:10px;
    border-radius:6px;background:rgba(255,255,255,.14);box-shadow:0 0 12px #000 inset;z-index:5;pointer-events:none;overflow:hidden}
  #bar>i{display:block;height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#7fd0ff,#ffe6a0);box-shadow:0 0 10px #ffd98a;transition:width .2s}
  /* overlay screens */
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px;z-index:8;background:rgba(4,6,11,.66);backdrop-filter:blur(3px);overflow:auto}
  #msg.hide{display:none}
  #msg h1{font-size:min(44px,8vw);margin:0 0 8px;color:#ffe4ad;text-shadow:0 0 26px #cf8a24,0 3px 0 #000;letter-spacing:1px}
  #msg h2{font-size:min(28px,6vw);margin:0 0 6px;color:#bfe3ff;text-shadow:0 0 22px #2f7fff}
  #msg p{font-size:min(17px,4.1vw);max-width:640px;line-height:1.55;opacity:.95;margin:6px 0}
  #msg .rows{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0 4px;max-width:680px}
  #msg .card{background:rgba(20,26,40,.6);border:1px solid rgba(150,180,230,.28);border-radius:12px;
    padding:8px 12px;font-size:14px;min-width:120px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  #msg .card b{display:block;font-size:15px;margin-bottom:2px}
  .s0{color:#ffb6d2}.s1{color:#ffd27a}.s2{color:#ff9d5c}.s3{color:#a8dcff}
  #msg .new{margin:10px auto 2px;max-width:600px;background:rgba(60,44,20,.55);border:1px solid rgba(255,210,140,.4);
    border-radius:12px;padding:10px 15px;color:#ffe6bf;font-size:15px;box-shadow:0 0 22px rgba(210,140,40,.25)}
  #msg .new b{color:#ffd98a}
  #msg .tap{margin-top:18px;font-size:16px;color:#ffe4ad;animation:blink 1.25s infinite}
  @keyframes blink{50%{opacity:.28}}
  /* controls */
  .ctl{position:fixed;bottom:34px;height:78px;border-radius:16px;border:2px solid rgba(160,195,255,.5);
    background:rgba(24,36,64,.42);color:#e6efff;display:flex;align-items:center;justify-content:center;
    gap:8px;font-family:Georgia,serif;backdrop-filter:blur(3px);box-shadow:0 6px 22px rgba(0,0,0,.4);
    z-index:6;touch-action:none;cursor:pointer;font-size:16px;letter-spacing:.5px;text-align:center}
  .ctl:active{background:rgba(70,120,220,.6);transform:translateY(2px)}
  .ctl.dis{opacity:.4;filter:grayscale(.6)}
  #bSeason{left:22px;width:210px;border-color:rgba(150,210,255,.6)}
  #bSeason .k{display:block;font-size:12px;opacity:.7}
  #bFwd{right:22px;width:180px;border-color:rgba(255,210,140,.65);color:#ffe6bf;font-size:21px}
  #bFwd:active{background:rgba(220,150,50,.6)}
  #bJump{right:214px;width:120px;border-color:rgba(180,255,190,.5);color:#dfffe4;font-size:16px}
  .ctl .k{font-size:12px;opacity:.65;margin-left:6px}
  @media(hover:hover) and (pointer:fine){.ctl{opacity:.92}}
  @media(max-width:640px){.ctl{height:64px}#bSeason{width:150px;font-size:14px}#bFwd{width:120px;font-size:18px}#bJump{right:150px;width:92px;font-size:14px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>

<div id="hud" class="hide">
  <div class="left">
    <div class="lvl" id="hLevel">Ниво 1</div>
    <div class="goal" id="hGoal">Цел: <b>стигни края на пътя</b></div>
  </div>
  <div class="season">
    <div class="big" id="hSeason">—</div>
    <div class="need" id="hNeed"></div>
    <div class="stat" id="hStat"></div>
  </div>
</div>
<div id="bar" class="hide"><i id="barFill"></i></div>

<div id="bSeason" class="ctl">⟳ Смени сезона<span class="k">[Интервал]</span></div>
<div id="bJump" class="ctl">Скок ▲<span class="k">[↑]</span></div>
<div id="bFwd" class="ctl">Напред ▶<span class="k">[→]</span></div>

<div id="msg"></div>

<script>
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), W=1280, H=720;
const GROUND=602;                 // линия на земята
const msg=document.getElementById('msg'), hud=document.getElementById('hud'), bar=document.getElementById('bar');
const barFill=document.getElementById('barFill');
const hLevel=document.getElementById('hLevel'), hGoal=document.getElementById('hGoal');
const hSeason=document.getElementById('hSeason'), hNeed=document.getElementById('hNeed'), hStat=document.getElementById('hStat');
const bSeasonEl=document.getElementById('bSeason');

/* ---------- реални растерни снимки ---------- */
const SRC={
  spring:'assets/bg_spring.jpg', summer:'assets/bg_summer.jpg', autumn:'assets/bg_autumn.jpg', winter:'assets/bg_winter.jpg',
  river:'assets/obs_river.jpg', fire:'assets/obs_fire.jpg', thorns:'assets/obs_thorns.jpg', mud:'assets/obs_mud.jpg',
  tower:'assets/tower.jpg', hero:'assets/hero.png', keep:'assets/keep.jpg', cage:'assets/cage.jpg',
  wolf:'assets/enemy_wolf.jpg', snake:'assets/enemy_snake.jpg', wasps:'assets/enemy_wasps.jpg', crows:'assets/enemy_crows.jpg',
  hz_flood:'assets/hz_flood.jpg', hz_wildfire:'assets/hz_wildfire.jpg', hz_avalanche:'assets/hz_avalanche.jpg'
};
const IMG={}; let loaded=0, failed=0; const keys=Object.keys(SRC);
keys.forEach(k=>{const im=new Image();im.onload=()=>{loaded++;};im.onerror=()=>{failed++;loaded++;console.error('липсва',SRC[k]);};im.src=SRC[k];IMG[k]=im;});
function imgOK(im){return im&&im.complete&&im.naturalWidth>0;}

/* ---------- сезони (ред: Пролет→Лято→Есен→Зима→Пролет) ---------- */
const SEASON={
  names:['Пролет','Лято','Есен','Зима'],
  bg:['spring','summer','autumn','winter'],
  tint:['rgba(120,200,120,0.16)','rgba(255,196,90,0.16)','rgba(230,130,40,0.20)','rgba(150,200,255,0.22)'],
  ground:['#3f5a32','#7a6b2c','#6b3d1f','#8ea6bd'],
  speed:[0.9,1.28,1.02,0.72],
  speedTxt:['мека пръст','сухо и бързо','вятър','дълбок сняг']
};

/* ---------- какво отваря/обезврежда всеки сезон ---------- */
const GATE_NEED ={river:3, fire:0, thorns:2, mud:1};   // река→зима/лед, огън→пролет/порой, тръни→есен, тресавище→лято
const ENEMY_NEED={wolf:1, snake:3, wasps:0, crows:2};  // вълци→лято, змии→зима, оси→пролет, врани→есен
const GATE_INFO={
  river:{name:'Пълноводна река',  open:'Зимата я сковава на ЛЕД — минаваш по него.'},
  fire :{name:'Огнена пукнатина', open:'Пролетният порой я угасява — минаваш през парата.'},
  thorns:{name:'Трънен гъсталак', open:'Есента ги изсушава — трошат се под ботуша.'},
  mud  :{name:'Кално тресавище',  open:'Лятната жега я спича на твърда пръст.'}
};
const ENEMY_INFO={
  wolf :{name:'Глутница вълци', img:'wolf',  open:'Лятната жега ги прогонва в сянка.'},
  snake:{name:'Кълбо змии',     img:'snake', open:'Зимният студ ги вцепенява.'},
  wasps:{name:'Рояк стършели',  img:'wasps', open:'Пролетният порой сваля роя.'},
  crows:{name:'Ято врани',      img:'crows', open:'Есенните ветрове разпръсват ятото.'}
};
const GATE_TYPES=['river','fire','thorns','mud'];
const isGate=t=>GATE_TYPES.indexOf(t)>=0;

/* ---------- построяване на нивата ---------- */
function minSwaps(seq){let cur=0,c=0;for(const s of seq){c+=((s-cur)+4)%4;cur=s;}return c;}
// def.seq елементи: 'river' | {t:'wolf',c:1(комбо, близо),m:1(движещ се)}
function buildLevel(def, idx){
  const L={n:idx+1, name:def.name, intro:def.intro||'', newEl:def.newEl||'', goalType:def.goal||'beacon', story:def.story||''};
  let x=780; const obs=[]; const seq=[];
  def.seq.forEach((o,i)=>{
    const t=(typeof o==='string')?o:o.t; const combo=(typeof o==='object')&&o.c;
    if(i>0) x += combo?320:640;
    const need=isGate(t)?GATE_NEED[t]:ENEMY_NEED[t];
    seq.push(need);
    const e={x, need, type:t, passed:false};
    if(isGate(t)){e.kind='gate'; e.jumpDone=false; e.name=GATE_INFO[t].name; e.openTxt=GATE_INFO[t].open;}
    else {e.kind='enemy'; e.dead=false; e.move=!!((typeof o==='object')&&o.m); e.name=ENEMY_INFO[t].name; e.openTxt=ENEMY_INFO[t].open; e.img=ENEMY_INFO[t].img;}
    obs.push(e);
  });
  L.obs=obs;
  L.endX=x+760;
  L.minSwaps=minSwaps(seq);
  L.margin=def.margin;
  L.swaps=L.minSwaps+def.margin;
  L.lives=def.lives||3;
  L.hazards=[];
  if(def.avAfter!=null){const g=obs[def.avAfter]; L.hazards.push({kind:'avalanche',danger:3,x1:g.x+130,x2:g.x+130+(def.avLen||560),max:def.avMax||2.7});}
  if(def.flAfter!=null){const g=obs[def.flAfter]; L.hazards.push({kind:'flood',danger:0,x1:g.x+130,x2:g.x+130+(def.flLen||560),max:def.flMax||2.7});}
  if(def.wf) L.wildfire={v:def.wf};
  // числа за трудност
  L.nGates=obs.filter(o=>o.kind==='gate').length;
  L.nEnemies=obs.filter(o=>o.kind==='enemy').length;
  L.nHaz=L.hazards.length+(L.wildfire?1:0);
  return L;
}
const LDEF=[
 {name:'Росната поляна', margin:6, lives:3, goal:'beacon', story:'Пред теб — див път до кулата. Първи сигнален огън чака да бъде запален.',
  intro:'Пътят е препречен. Всеки сезон преобразява света: това, което те спира сега, друг сезон ще отвори. Смени времето и мини.',
  newEl:'Река иска ЗИМА (лед). Огън иска ПРОЛЕТ (порой).', seq:['river','fire']},
 {name:'Каменният брод', margin:6, lives:3, goal:'beacon', story:'Втори фар по билото.',
  newEl:'Тръни искат ЕСЕН — изсъхват и се трошат.', seq:['river','fire','thorns']},
 {name:'Тихата гора', margin:5, lives:3, goal:'beacon', story:'Целите четири сезона вече ти трябват.',
  newEl:'Тресавище иска ЛЯТО — жегата го спича.', seq:['fire','thorns','mud','river']},
 {name:'Вълчият дол', margin:5, lives:3, goal:'beacon', story:'В дола дебнат зверове.',
  newEl:'ВРАГ: глутница вълци. Само ЛЯТО ги прогонва. В грешен сезон — раняват те.', seq:['river',{t:'wolf'},'fire','thorns']},
 {name:'Змийските скали', margin:5, lives:3, goal:'beacon', story:'Скали, пълни с влечуги.',
  newEl:'ВРАГ: змии — обезврежда ги само ЗИМА (студ).', seq:['thorns',{t:'snake'},'mud',{t:'wolf'},'river']},
 {name:'Ледникът', margin:4, lives:3, goal:'cage', story:'Първи пленник — в клетка отвъд ледника.',
  newEl:'ОПАСНОСТ: ЛАВИНА. Стоиш ли в ЗИМА в ледения пояс — те затрупва. Мини реката като зима, после веднага смени сезона!',
  avAfter:0, seq:['river','fire',{t:'snake'},'thorns']},
 {name:'Осовият процеп', margin:4, lives:3, goal:'cage', story:'Тесен процеп, бръмчащ от криле.',
  newEl:'ВРАГ: рояк стършели — сваля го само ПРОЛЕТНИЯТ порой. Портите идват по двойки — сменяй бързо!',
  seq:['fire',{t:'wasps',c:1},'mud',{t:'wolf'},'thorns']},
 {name:'Изгорелият лес', margin:4, lives:3, goal:'cage', story:'Зад теб пламва гора.',
  newEl:'ОПАСНОСТ: ГОРСКИ ПОЖАР те гони отзад и се разраства. Не спирай! ПРОЛЕТ (порой) го отблъсква.',
  wf:80, seq:['fire','thorns',{t:'snake'},'mud',{t:'wolf'}]},
 {name:'Гарвановото блато', margin:4, lives:3, goal:'cage', story:'Черни криле над тресавището.',
  newEl:'ВРАГ: ято врани — пръска го ЕСЕН. ОПАСНОСТ: ПРИДОШЛИ ВОДИ — стоиш ли в ПРОЛЕТ в наводнения пояс, потъваш.',
  flAfter:0, seq:['fire',{t:'crows'},'mud',{t:'snake'},'thorns']},
 {name:'Двата брода', margin:3, lives:3, goal:'cage', story:'Река и тресавище едно до друго.',
  newEl:'Комбинирани порти плътно една до друга — светкавична смяна.',
  seq:['river',{t:'mud',c:1},'fire','thorns',{t:'wolf'},{t:'snake'}]},
 {name:'Тръненият лабиринт', margin:3, lives:3, goal:'cage', story:'Плетеница от порти и криле.',
  seq:['thorns',{t:'fire',c:1},'river',{t:'mud',c:1},{t:'crows'},{t:'wasps'}]},
 {name:'Пепелища и лед', margin:3, lives:3, goal:'keep', story:'Стражева кула с втори пленник.',
  newEl:'Пожар И лавина в едно ниво. Прекоси реката, но не оставай в зимата над ледника.',
  wf:84, avAfter:1, seq:['fire','river','thorns',{t:'snake'},{t:'wolf'}]},
 {name:'Клопката на пороите', margin:3, lives:3, goal:'keep', story:'Придошли води дебнат отвсякъде.',
  flAfter:0, seq:['fire','mud',{t:'wasps'},'river',{t:'crows'},'thorns']},
 {name:'Хребетът на лавините', margin:3, lives:3, goal:'keep', story:'Тесен леден хребет.',
  avAfter:0, seq:['river','fire',{t:'snake',c:1},'mud',{t:'wolf'},'thorns',{t:'crows'}]},
 {name:'Портите на здрача', margin:2, lives:3, goal:'keep', story:'Осем препятствия, много от тях слепени.',
  seq:['thorns',{t:'fire',c:1},'river',{t:'mud',c:1},{t:'wasps'},{t:'snake'},{t:'wolf'},{t:'crows'}]},
 {name:'Стражевата кула', margin:2, lives:3, goal:'keep', story:'Последният пленник преди кулата.',
  newEl:'Пожар отзад, движещ се рояк, всички сезони — истинско изпитание.',
  wf:88, avAfter:2, seq:['fire','thorns','river','mud',{t:'snake'},{t:'wasps',m:1},{t:'crows'},{t:'wolf'}]},
 {name:'Дългият пристъп', margin:2, lives:3, goal:'keep', story:'Дълъг щурм към кулата на принцесата.',
  wf:90, flAfter:1, seq:['river','fire','thorns','mud',{t:'wolf'},{t:'snake'},{t:'wasps',c:1},{t:'crows'}]},
 {name:'Кулата на принцесата', margin:2, lives:4, goal:'tower', story:'Кулминацията: кулата, принцесата — и всяко изпитание наведнъж.',
  newEl:'Пожар, лавина, придошли води, зверове и деветте порти. Стигни кулата и я освободи.',
  wf:86, avAfter:0, flAfter:1, seq:['river','fire','thorns','mud',{t:'snake'},{t:'wolf'},{t:'wasps'},{t:'crows'},'river']}
];
const LEVELS=LDEF.map(buildLevel);

/* ---------- състояние ---------- */
let state='title';              // title|intro|play|clear|fail|win
let curLevel=0, L=null;         // текущо ниво (работно копие)
let season=0, prevSeason=0, fade=0, t=0, last=0, booted=false;
let swaps=0, lives=3, seasonCd=0;
let hero, cam=0, forward=false, invuln=0, stuckT=0, shake=0, failReason='', endFlash=0, clearsDone=0;
let petals=[], flakes=[], leaves=[], dust=[];

function activeBarrier(){ if(!L)return null; for(const o of L.obs) if(!o.passed) return o; return null; }
function barrierClosed(o){ if(o.kind==='gate') return season!==o.need; return !o.dead && season!==o.need; }
function seasonMod(){return SEASON.speed[season];}
function MAXCAM(){return Math.max(0, L.endX+320-W);}

/* ---------- зареждане на ниво ---------- */
function loadLevel(i){
  curLevel=i; const T=LEVELS[i];
  L=JSON.parse(JSON.stringify(T));          // работно копие
  season=0; prevSeason=0; fade=0;
  swaps=L.swaps; lives=L.lives;
  seasonCd=0; invuln=0; stuckT=0; shake=0; endFlash=0;
  hero={x:150,y:0,vy:0,jump:false,jt:0,mode:'idle',ph:0,blocked:false};
  cam=0; forward=false;
  petals=[];flakes=[];leaves=[];dust=[]; seedParticles();
  syncHud();
}

/* ---------- екрани ---------- */
function screenClass(){hud.classList.add('hide');bar.classList.add('hide');msg.classList.remove('hide');}
function playClass(){msg.classList.add('hide');hud.classList.remove('hide');bar.classList.remove('hide');}
function seasonCard(need){return '<span class="s'+need+'">'+SEASON.names[need]+'</span>';}

function showTitle(){
  screenClass();
  msg.innerHTML=
   '<h1>СЕЗОНИТЕ</h1>'+
   '<p>Принцесата е затворена в кулата отвъд дивата земя. Ти — воинът — трябва да преминеш <b>18 нива</b> от препятствия.'+
   ' <b>Всеки сезон преобразява света</b>: реката замръзва, огънят гасне, тръните съхнат, калта се спича.</p>'+
   '<div class="rows">'+
     '<div class="card"><b class="s3">❄ Зима</b>река → лед · спира змии</div>'+
     '<div class="card"><b class="s0">✿ Пролет</b>порой гаси огъня · сваля оси</div>'+
     '<div class="card"><b class="s2">🍂 Есен</b>тръните съхнат · пръска врани</div>'+
     '<div class="card"><b class="s1">☀ Лято</b>калта се спича · гони вълци</div>'+
   '</div>'+
   '<p><small>→ Напред · Интервал сменя сезона (брой смени е ограничен!) · ↑ скок · R рестарт на нивото</small></p>'+
   '<div class="tap">Натисни ▶ Напред (или →), за да тръгнеш</div>';
}
function newElBlock(lv){return lv.newEl?('<div class="new"><b>Ново:</b> '+lv.newEl+'</div>'):'';}
function showIntro(){
  screenClass();
  const lv=LEVELS[curLevel];
  msg.innerHTML=
   '<h2>Ниво '+lv.n+' от 18</h2>'+
   '<h1>'+lv.name+'</h1>'+
   '<p>'+lv.story+'</p>'+
   newElBlock(lv)+
   '<p><small>Смени на сезона: <b>'+lv.swaps+'</b> · Животи: <b>'+lv.lives+' ♥</b> · Порти: '+lv.nGates+' · Врагове: '+lv.nEnemies+(lv.nHaz?(' · Опасности: '+lv.nHaz):'')+'</small></p>'+
   '<div class="tap">Натисни ▶ Напред, за да започнеш</div>';
}
function goalWord(g){return g==='tower'?'принцесата в кулата':g==='keep'?'пленникът в стражевата кула':g==='cage'?'пленникът в клетката':'сигналният огън';}
function showClear(){
  screenClass();

/* ---------- вход / преходи ---------- */
function beginPlay(){ state='play'; playClass(); syncHud(); }
function press(){
  if(state==='title'){ loadLevel(0); state='intro'; showIntro(); return; }
  if(state==='intro'){ beginPlay(); forward=true; return; }
  if(state==='clear'){ loadLevel(curLevel+1); state='intro'; showIntro(); return; }
  if(state==='fail'){ loadLevel(curLevel); state='intro'; showIntro(); return; }
  if(state==='win'){ state='title'; showTitle(); return; }
  forward=true; // play
}
function release(){ forward=false; }
function changeSeason(){ if(state!=='play')return; if(seasonCd>0||swaps<=0)return; prevSeason=season; season=(season+1)%4; fade=1; seasonCd=.12; swaps--; syncHud(); }
function doJump(){ if(state==='play'&&!hero.jump){hero.jump=true;hero.jt=0;} }
function restartLevel(){ if(state==='play'||state==='fail'||state==='clear'){ loadLevel(curLevel); state='intro'; showIntro(); } }

addEventListener('keydown',e=>{
  if(e.repeat){if(e.code==='ArrowRight'||e.code==='KeyD')e.preventDefault();return;}
  if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();press();}
  else if(e.code==='Space'){e.preventDefault(); if(state==='play')changeSeason(); else press();}
  else if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();doJump();}
  else if(e.code==='Enter'){e.preventDefault(); if(state!=='play')press();}
  else if(e.code==='KeyR'){e.preventDefault();restartLevel();}
});
addEventListener('keyup',e=>{ if(e.code==='ArrowRight'||e.code==='KeyD')release(); });

function bindHold(el,down,up){
  el.addEventListener('pointerdown',e=>{e.preventDefault();down();},{passive:false});
  el.addEventListener('pointerup',e=>{e.preventDefault();up&&up();});
  el.addEventListener('pointerleave',()=>{up&&up();});
  el.addEventListener('pointercancel',()=>{up&&up();});
}
bindHold(document.getElementById('bFwd'),press,release);
document.getElementById('bJump').addEventListener('pointerdown',e=>{e.preventDefault();doJump();},{passive:false});
bSeasonEl.addEventListener('pointerdown',e=>{e.preventDefault(); if(state==='play')changeSeason(); else press();},{passive:false});
msg.addEventListener('pointerdown',e=>{e.preventDefault();press(); if(state==='play')forward=true;},{passive:false});
addEventListener('pointerup',()=>{forward=false;});

/* ---------- HUD ---------- */
function syncHud(){
  if(!L)return;
  const lv=LEVELS[curLevel];
  hLevel.innerHTML='Ниво <b>'+lv.n+'</b>/18 · '+lv.name;
  hGoal.innerHTML='Цел: <b>'+goalWord(lv.goalType)+'</b>';
  hSeason.innerHTML='Сезон: <b class="s'+season+'">'+SEASON.names[season]+'</b>';
  const o=activeBarrier();
  if(o){ const ok=season===o.need;
    hNeed.innerHTML=(o.kind==='enemy'?'⚔ ':'')+o.name+' — '+(ok?'<span style="color:#9dffa0">'+(o.kind==='enemy'?'обезвреден ✓':'отворено ✓')+'</span>':'нужен: '+seasonCard(o.need));
  } else hNeed.innerHTML='Пътят е чист — към целта! · <small>'+SEASON.speedTxt[season]+'</small>';
  const low=swaps<=2;
  hStat.innerHTML='<span class="sw'+(low?' low':'')+'">Смени: '+swaps+'</span> · <span class="hp">'+'♥'.repeat(Math.max(0,lives))+'</span>';
  bSeasonEl.classList.toggle('dis',swaps<=0);
  barFill.style.width=(4+Math.min(1,hero?hero.x/L.endX:0)*96)+'%';
}

/* ---------- частици ---------- */
function seedParticles(){
  petals=[];flakes=[];leaves=[];
  for(let i=0;i<70;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*3,vx:-.3-Math.random(),vy:.6+Math.random()*1.4,sw:Math.random()*6});
  for(let i=0;i<40;i++)petals.push({x:Math.random()*W,y:Math.random()*H,s:3+Math.random()*3,vx:-.4-Math.random()*.7,vy:.5+Math.random(),r:Math.random()*6.28,vr:.03});
  for(let i=0;i<32;i++)leaves.push({x:Math.random()*W,y:Math.random()*H,s:5+Math.random()*5,vx:-.8-Math.random()*1.6,vy:.4+Math.random()*.9,r:Math.random()*6.28,vr:.05+Math.random()*.05});
}
function updParticles(dt){
  if(season===3){for(const f of flakes){f.x+=f.vx;f.y+=f.vy;f.sw+=.05;f.x+=Math.sin(f.sw)*.3;if(f.y>H){f.y=-4;f.x=Math.random()*W;}if(f.x<-6)f.x=W+6;}}
  if(season===0){for(const p of petals){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>H){p.y=-6;p.x=Math.random()*W;}if(p.x<-8)p.x=W+8;}}
  if(season===2){for(const l of leaves){l.x+=l.vx;l.y+=l.vy;l.r+=l.vr;if(l.y>H||l.x<-10){l.y=-8;l.x=W+Math.random()*40;}}}
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.x+=d.vx;d.y+=d.vy;d.vy+=.05;d.life-=dt;if(d.life<=0)dust.splice(i,1);}
}
function drawParticles(){
  ctx.save();
  if(season===3){ctx.fillStyle='rgba(240,248,255,.9)';for(const f of flakes){ctx.globalAlpha=.5+f.s/6;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill();}}
  if(season===0){for(const p of petals){ctx.globalAlpha=.8;ctx.fillStyle='#ffbcd6';ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.5,0,0,7);ctx.fill();ctx.restore();}}
  if(season===1){ctx.globalAlpha=.5;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,230,150,.25)');g.addColorStop(1,'rgba(255,230,150,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.6);
    ctx.globalAlpha=.35;ctx.fillStyle='#fff3c8';for(let i=0;i<18;i++){const x=(i*90+t*0.6)%W,y=120+((i*57)%320)+Math.sin(t*0.03+i)*8;ctx.beginPath();ctx.arc(x,y,1.6,0,7);ctx.fill();}}
  if(season===2){for(const l of leaves){ctx.globalAlpha=.9;ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.r);ctx.fillStyle=['#c8721f','#a83e1e','#d79a2b'][(l.s|0)%3];ctx.beginPath();ctx.ellipse(0,0,l.s,l.s*.45,0,0,7);ctx.fill();ctx.restore();}}
  ctx.globalAlpha=1;
  for(const d of dust){ctx.globalAlpha=Math.max(0,d.life/d.max)*.5;ctx.fillStyle='#d8cbb0';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill();}
  ctx.restore();
}

/* ---------- обновяване ---------- */
function damage(reason){
  if(invuln>0)return;
  lives--; invuln=1.25; shake=Math.max(shake,10);
  hero.x=Math.max(120,hero.x-95);
  if(lives<=0){ failReason=reason||'Раните бяха твърде много — воинът падна.'; fail(); }
  syncHud();
}
function fail(reason){ if(reason)failReason=reason; state='fail'; forward=false; showFail(); }
function onReachEnd(){
  if(curLevel>=LEVELS.length-1){ state='win'; endFlash=1; showWin(); }
  else { clearsDone++; state='clear'; endFlash=1; showClear(); }
}

function update(dt){
  t++; if(seasonCd>0)seasonCd=Math.max(0,seasonCd-dt); if(fade>0)fade=Math.max(0,fade-dt*2.2); if(invuln>0)invuln-=dt; if(shake>0)shake=Math.max(0,shake-dt*22);
  updParticles(dt);
  if(endFlash>0)endFlash=Math.max(0,endFlash-dt*0.6);
  if(state!=='play')return;

  const mod=seasonMod(); const o=activeBarrier(); let moving=false;

  // движещи се врагове (патрул към героя в грешен сезон)
  for(const e of L.obs){ if(e.kind==='enemy'&&e.move&&!e.dead&&!e.passed){
    if(season!==e.need && Math.abs(e.x-hero.x)<300 && e.x>hero.x){ e.x-=52*dt; }
  }}

  if(forward){
    let nx=hero.x + 205*mod*dt;
    if(o){
      // обезвреждане на враг щом влезеш в неговия сезон и си близо
      if(o.kind==='enemy' && season===o.need && Math.abs(hero.x-o.x)<300) o.dead=true;
      const closed=barrierClosed(o);
      if(closed){
        const bx=o.x-46;
        if(nx>bx){ nx=bx; hero.blocked=true; } else hero.blocked=false;
        if(o.kind==='enemy' && hero.x>=o.x-56){ damage('Нападнаха те '+o.name.toLowerCase()+' в грешен сезон.'); }
      } else {
        hero.blocked=false;
        if(o.kind==='gate' && !o.jumpDone && hero.x>=o.x-70 && !hero.jump){ hero.jump=true;hero.jt=0;o.jumpDone=true; }
        if(nx>=o.x+30){ o.passed=true; syncHud(); }
      }
    } else hero.blocked=false;
    if(nx>=L.endX){ nx=L.endX; hero.x=nx; onReachEnd(); return; }
    if(nx>hero.x)moving=true;
    hero.x=nx;
  } else hero.blocked=false;

  // заклещване при изчерпани смени
  if(o && barrierClosed(o) && swaps<=0 && season!==o.need){ stuckT+=dt; if(stuckT>3.6){ fail('Изчерпа смените на сезона и остана заклещен пред '+o.name.toLowerCase()+'.'); } }
  else stuckT=0;

  // опасности: лавина / придошли води
  for(const hz of L.hazards){
    const inZone = hero.x>=hz.x1 && hero.x<=hz.x2;
    if(inZone && season===hz.danger){ hz.build=(hz.build||0)+dt; shake=Math.max(shake,4+hz.build*3);
      if(hz.build>=hz.max){ fail(hz.kind==='avalanche'?'Лавина се срина и те затрупа — стоя твърде дълго в зимата.':'Придошлите води те повлякоха — стоя твърде дълго в пролетта.'); }
    } else { hz.build=Math.max(0,(hz.build||0)-dt*1.6); }
  }
  // горски пожар (гони отзад, разраства се; пролетта го отблъсква)
  if(L.wildfire){
    const wf=L.wildfire; if(wf.x==null)wf.x=hero.x-460;
    let v=wf.v;
    if(season===0){ wf.x-=v*1.6*dt; }          // пролетният порой го връща
    else { wf.x+=v*dt; }
    if(wf.x<hero.x-560)wf.x=hero.x-560;         // не изостава прекалено
    if(wf.x>=hero.x-30){ fail('Горският пожар те застигна — трябваше да бързаш или да го гасиш с пролет.'); }
  }

  // режим на анимация
  const inGate=o && Math.abs(hero.x-o.x)<120 && season===o.need;
  if(hero.jump)hero.mode='jump'; else if(moving)hero.mode=inGate?'run':'walk'; else hero.mode='idle';
  const rate=hero.mode==='run'?15:hero.mode==='walk'?9.5:2.2;
  const before=hero.ph; hero.ph+=dt*rate;
  if(hero.mode==='walk'||hero.mode==='run'){
    if(Math.floor(before/Math.PI)!==Math.floor(hero.ph/Math.PI)){
      const sx=hero.x-cam;
      for(let i=0;i<5;i++)dust.push({x:sx-6+Math.random()*12,y:GROUND-2,vx:-.6-Math.random()*1.2,vy:-.4-Math.random()*.8,r:2+Math.random()*3,life:.5,max:.5});
    }
  }
  if(hero.jump){hero.jt+=dt;const dur=.62,p=hero.jt/dur; if(p>=1){hero.jump=false;hero.y=0;} else hero.y=-Math.sin(Math.PI*p)*128;}
  else hero.y+=(0-hero.y)*Math.min(1,dt*10);

  const target=Math.min(MAXCAM(),Math.max(0,hero.x-430));
  cam+=(target-cam)*Math.min(1,dt*6);
  syncHud();
}

/* ---------- рисуване ---------- */
function coverDraw(im,x,y,w,h){ if(!imgOK(im)){ctx.fillStyle='#223';ctx.fillRect(x,y,w,h);return;}
  const ir=im.naturalWidth/im.naturalHeight, r=w/h; let sw,sh,sx,sy;
  if(ir>r){sh=im.naturalHeight;sw=sh*r;sx=(im.naturalWidth-sw)/2;sy=0;}else{sw=im.naturalWidth;sh=sw/r;sx=0;sy=(im.naturalHeight-sh)/2;}
  ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h);
}
function drawBackground(){
  const par=-cam*0.06, cur=IMG[SEASON.bg[season]];
  ctx.save();
  coverDraw(cur,par,0,W-par*2,H);
  if(fade>0){ctx.globalAlpha=fade;coverDraw(IMG[SEASON.bg[prevSeason]],par,0,W-par*2,H);ctx.globalAlpha=1;}
  ctx.restore();
  ctx.fillStyle=SEASON.tint[season];ctx.fillRect(0,0,W,H);
  const vg=ctx.createLinearGradient(0,0,0,H);
  vg.addColorStop(0,'rgba(5,8,14,0.28)');vg.addColorStop(.55,'rgba(5,8,14,0.05)');vg.addColorStop(1,'rgba(4,6,11,0.7)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function drawGround(){
  const gy=GROUND;
  const grd=ctx.createLinearGradient(0,gy-10,0,H);
  grd.addColorStop(0,SEASON.ground[season]);grd.addColorStop(1,'#0b0d12');
  ctx.fillStyle=grd;ctx.fillRect(0,gy,W,H-gy);
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,gy+2);ctx.lineTo(W,gy+2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=2;
  const step=64,off=(-cam)%step;
  for(let x=off;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,gy+18);ctx.lineTo(x-22,H-16);ctx.stroke();}
}
function drawHazardZones(){
  for(const hz of L.hazards){
    const a=hz.x1-cam,b=hz.x2-cam; if(b<-40||a>W+40)continue;
    const active=hero&&hero.x>=hz.x1&&hero.x<=hz.x2&&season===hz.danger;
    ctx.save();
    if(hz.kind==='avalanche'){
      // леден пояс на терена
      coverDraw(IMG.hz_avalanche,a,GROUND-70,b-a,70);
      ctx.fillStyle='rgba(190,220,255,'+(active?0.30+0.14*Math.sin(t*0.4):0.16)+')';ctx.fillRect(a,GROUND-70,b-a,70);
      ctx.strokeStyle='rgba(210,235,255,.5)';ctx.lineWidth=2;ctx.strokeRect(a,GROUND-70,b-a,70);
      if(active){for(let i=0;i<20;i++){const x=a+Math.random()*(b-a),y=Math.random()*GROUND;ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(x,y,2+Math.random()*3,0,7);ctx.fill();}}
    } else { // flood
      const rise=active?(0.35+0.2*Math.sin(t*0.3)):0.2;
      coverDraw(IMG.hz_flood,a,GROUND-64,b-a,64);
      ctx.fillStyle='rgba(70,120,150,'+rise+')';ctx.fillRect(a,GROUND-64,b-a,64+(active?18:0));
      ctx.strokeStyle='rgba(180,220,235,.45)';ctx.lineWidth=2;ctx.strokeRect(a,GROUND-64,b-a,64);
    }
    ctx.restore();
    if(active){
      const bx=(a+b)/2;
      ctx.save();ctx.textAlign='center';ctx.font='bold 20px Georgia';
      ctx.fillStyle=hz.kind==='avalanche'?'#dff0ff':'#bfe3ff';ctx.shadowColor='#000';ctx.shadowBlur=10;
      ctx.globalAlpha=.6+0.4*Math.sin(t*0.4);
      ctx.fillText(hz.kind==='avalanche'?'❄ ЛАВИНА — напусни зимата!':'🌊 ПРИДОШЛИ ВОДИ — напусни пролетта!',Math.min(Math.max(bx,220),W-220),120);
      ctx.restore();
      // индикатор за натрупване
      const p=Math.min(1,(hz.build||0)/hz.max);
      ctx.save();ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(bx-70,150,140,10);
      ctx.fillStyle=p>0.7?'#ff6a6a':'#ffd27a';ctx.fillRect(bx-70,150,140*p,10);ctx.restore();
    }
  }
}
function drawWildfire(){
  if(!L.wildfire||L.wildfire.x==null)return;
  const fx=L.wildfire.x-cam; if(fx>W+80)return;
  ctx.save();
  const g=ctx.createLinearGradient(fx-160,0,fx+30,0);
  g.addColorStop(0,'rgba(20,6,2,0)');g.addColorStop(.7,'rgba(60,16,4,.55)');g.addColorStop(1,'rgba(20,6,2,.85)');
  ctx.fillStyle=g;ctx.fillRect(fx-160,0,190,H);
  for(let i=0;i<40;i++){const x=fx-10+Math.sin(t*0.2+i)*14-Math.random()*18,y=GROUND-Math.random()*260;
    ctx.fillStyle=['#ff5a1e','#ffb020','#ff2a08'][i%3];ctx.globalAlpha=.5+Math.random()*.4;
    ctx.beginPath();ctx.ellipse(x,y,5+Math.random()*7,12+Math.random()*20,0,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
  ctx.save();ctx.textAlign='left';ctx.font='bold 18px Georgia';ctx.fillStyle='#ff9a4a';ctx.shadowColor='#000';ctx.shadowBlur=8;
  ctx.globalAlpha=.7+0.3*Math.sin(t*0.3);ctx.fillText('🔥 Пожарът те гони — не спирай!',24,150);ctx.restore();
}
function drawGate(o){
  const sx=o.x-cam; if(sx<-260||sx>W+260)return;
  const gw=176, low=(o.type==='river'||o.type==='mud'), gh=low?150:300, top=GROUND-gh;
  const open=o.passed||season===o.need;
  ctx.save();
  ctx.beginPath();ctx.rect(sx-gw/2,top,gw,gh);ctx.clip();
  coverDraw(IMG[o.type],sx-gw/2,top,gw,gh);
  if(open){
    if(o.type==='river'){ctx.fillStyle='rgba(200,230,255,.55)';ctx.fillRect(sx-gw/2,top,gw,gh);
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(sx-gw/2,top+i*gh/6+8);ctx.lineTo(sx+gw/2,top+i*gh/6-6);ctx.stroke();}}
    if(o.type==='fire'){ctx.fillStyle='rgba(90,110,140,.6)';ctx.fillRect(sx-gw/2,top,gw,gh);
      ctx.strokeStyle='rgba(200,220,255,.5)';ctx.lineWidth=1.5;for(let i=0;i<20;i++){const rx=sx-gw/2+Math.random()*gw;ctx.beginPath();ctx.moveTo(rx,top);ctx.lineTo(rx-8,top+gh);ctx.stroke();}}
    if(o.type==='thorns')ctx.fillStyle='rgba(150,110,40,.5)',ctx.fillRect(sx-gw/2,top,gw,gh);
    if(o.type==='mud')ctx.fillStyle='rgba(210,170,110,.42)',ctx.fillRect(sx-gw/2,top,gw,gh);
  } else {
    ctx.fillStyle='rgba(6,8,14,'+(0.18+0.10*Math.sin(t*0.1))+')';ctx.fillRect(sx-gw/2,top,gw,gh);
    if(o.type==='fire'){ctx.fillStyle='rgba(255,140,30,'+(0.10+0.08*Math.sin(t*0.2))+')';ctx.fillRect(sx-gw/2,top,gw,gh);}
  }
  ctx.restore();
  gateLabel(o,sx,top,open);
}
function drawEnemy(o){
  const sx=o.x-cam; if(sx<-240||sx>W+240)return;
  const w=132,h=132, top=GROUND-h-6;
  const safe=o.dead||season===o.need;
  ctx.save();
  ctx.beginPath();ctx.ellipse(sx,top+h/2,w/2,h/2,0,0,7);ctx.clip();
  coverDraw(IMG[o.img],sx-w/2,top,w,h);
  if(safe){ctx.fillStyle='rgba(120,180,120,.45)';ctx.fillRect(sx-w/2,top,w,h);}
  else {ctx.fillStyle='rgba(120,10,10,'+(0.18+0.14*Math.sin(t*0.2))+')';ctx.fillRect(sx-w/2,top,w,h);}
  ctx.restore();
  // рамка/аура
  ctx.save();ctx.lineWidth=3;ctx.strokeStyle=safe?'rgba(150,255,160,.8)':'rgba(255,90,80,'+(0.6+0.3*Math.sin(t*0.25))+')';
  ctx.beginPath();ctx.ellipse(sx,top+h/2,w/2+2,h/2+2,0,0,7);ctx.stroke();ctx.restore();
  if(o.dead){ctx.save();ctx.globalAlpha=.85;ctx.fillStyle='#bdffc0';ctx.font='26px Georgia';ctx.textAlign='center';ctx.fillText('✓',sx,top+h/2+9);ctx.restore();}
  gateLabel(o,sx,top,safe,true);
}
function gateLabel(o,sx,top,open,enemy){
  ctx.save();ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=8;
  ctx.font='16px Georgia';ctx.fillStyle=open?'#bdffc0':'#ffd0d0';
  ctx.fillText((open?'✓ ':(enemy?'⚔ ':'⛔ '))+o.name,sx,top-26);
  ctx.font='13px Georgia';ctx.fillStyle=open?'rgba(210,255,215,.9)':'rgba(255,220,220,.85)';
  ctx.fillText(open?o.openTxt:('нужен: '+SEASON.names[o.need]),sx,top-8);
  ctx.restore();
}
function drawGoal(){
  const gx=L.endX-cam; if(gx<-460)return;
  const g=L.goalType;
  if(g==='tower'){ drawTower(); return; }
  const im = g==='cage'?IMG.cage : IMG.keep;
  const tw=g==='cage'?230:280, th=g==='cage'?300:440, tx=gx-tw/2+120, top=GROUND-th;
  const won=(state==='clear'||state==='win');
  ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=26;coverDraw(im,tx,top,tw,th);ctx.shadowBlur=0;
  // светеща фигура на пленника
  const wx=tx+tw*0.5, wy=top+th*(g==='cage'?0.5:0.42), glow=won?1:0.5+0.25*Math.sin(t*0.06);
  const rg=ctx.createRadialGradient(wx,wy,2,wx,wy,58);
  rg.addColorStop(0,'rgba(255,240,200,'+glow+')');rg.addColorStop(.4,'rgba(255,214,140,'+(glow*.7)+')');rg.addColorStop(1,'rgba(255,180,80,0)');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(wx,wy,58,0,7);ctx.fill();
  ctx.fillStyle='rgba(60,35,20,'+(won?1:.8)+')';ctx.beginPath();ctx.arc(wx,wy-6,5,0,7);ctx.fill();ctx.fillRect(wx-5,wy-2,10,16);
  ctx.restore();
  ctx.save();ctx.textAlign='center';ctx.font='15px Georgia';ctx.fillStyle='#ffe4ad';ctx.shadowColor='#000';ctx.shadowBlur=8;
  ctx.fillText(g==='cage'?'Пленник в клетка':'Стражева кула',gx+120,top-14);ctx.restore();
}
function drawTower(){
  const sx=L.endX-cam; if(sx<-400)return;
  const tw=300,th=470,tx=sx-tw/2+120,top=GROUND-th;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=30;coverDraw(IMG.tower,tx,top,tw,th);ctx.shadowBlur=0;
  const wx=tx+tw*0.5,wy=top+th*0.34,glow=(state==='win')?1:0.55+0.25*Math.sin(t*0.06);
  const rg=ctx.createRadialGradient(wx,wy,2,wx,wy,64);
  rg.addColorStop(0,'rgba(255,240,200,'+glow+')');rg.addColorStop(.4,'rgba(255,214,140,'+(glow*.7)+')');rg.addColorStop(1,'rgba(255,180,80,0)');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(wx,wy,64,0,7);ctx.fill();
  ctx.fillStyle='rgba(70,45,20,.9)';ctx.fillRect(wx-13,wy-20,26,40);
  ctx.fillStyle='rgba(255,238,190,'+glow+')';ctx.fillRect(wx-10,wy-17,20,34);
  ctx.fillStyle='rgba(60,35,20,'+(state==='win'?1:.8)+')';ctx.beginPath();ctx.arc(wx,wy-6,5,0,7);ctx.fill();ctx.fillRect(wx-5,wy-2,10,18);
  ctx.restore();
  ctx.save();ctx.textAlign='center';ctx.font='15px Georgia';ctx.fillStyle='#ffe4ad';ctx.shadowColor='#000';ctx.shadowBlur=8;
  ctx.fillText('Кулата на принцесата',sx+120,top-16);ctx.restore();
}
function drawHero(){
  const im=IMG.hero, sx=hero.x-cam, footBase=GROUND+42, h=236, w=imgOK(im)?h*(im.naturalWidth/im.naturalHeight):h*0.7;
  let bob=0,lean=0,sq=1,rock=0;
  if(hero.mode==='walk'){bob=Math.abs(Math.sin(hero.ph))*7;lean=Math.sin(hero.ph*2)*0.03+0.05;rock=Math.sin(hero.ph)*0.04;}
  else if(hero.mode==='run'){bob=Math.abs(Math.sin(hero.ph))*11;lean=0.16+Math.sin(hero.ph*2)*0.04;rock=Math.sin(hero.ph)*0.06;}
  else if(hero.mode==='idle'){bob=Math.sin(t*0.05)*2;}
  const y=footBase+hero.y-bob;
  ctx.save();const shA=0.42*(1-Math.min(1,-hero.y/128));ctx.fillStyle='rgba(0,0,0,'+shA+')';ctx.beginPath();ctx.ellipse(sx,GROUND-2,w*0.40,12,0,0,7);ctx.fill();ctx.restore();
  if(hero.mode==='run'){for(let i=1;i<=2;i++){ctx.save();ctx.globalAlpha=0.16/i;drawHeroSprite(im,sx-i*10,y,w,h,lean,sq,rock);ctx.restore();}}
  if(hero.jump){const p=hero.jt/0.62;sq=1+Math.sin(Math.PI*p)*0.10;lean=0.12;}
  // мигане при инвулн
  ctx.save();ctx.globalAlpha=(invuln>0&&Math.floor(t*0.5)%2===0)?0.4:1;drawHeroSprite(im,sx,y,w,h,lean,sq,rock);ctx.restore();
  const grd=ctx.createLinearGradient(0,GROUND-4,0,H);grd.addColorStop(0,SEASON.ground[season]);grd.addColorStop(1,'#0b0d12');
  ctx.fillStyle=grd;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,GROUND+1);ctx.lineTo(W,GROUND+1);ctx.stroke();
}
function drawHeroSprite(im,cx,footY,w,h,lean,sq,rock){
  ctx.translate(cx,footY);ctx.rotate(rock||0);ctx.transform(1,0,-(lean||0),1,0,0);ctx.scale(1,sq||1);
  if(imgOK(im))ctx.drawImage(im,-w/2,-h,w,h);else{ctx.fillStyle='#1a1720';ctx.fillRect(-w/2,-h,w,h);}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBackground();
  drawParticles();
  drawGround();
  if(L){
    drawHazardZones();
    for(const o of L.obs){ if(o.kind==='gate')drawGate(o); else drawEnemy(o); }
    drawGoal();
    drawWildfire();
    if(state!=='title')drawHero();
    if(state==='play'&&!activeBarrier()){ctx.save();ctx.globalAlpha=.6+0.3*Math.sin(t*0.1);ctx.fillStyle='#ffe6a0';ctx.font='20px Georgia';ctx.textAlign='center';ctx.fillText('→ към целта',hero.x-cam+130,GROUND-246);ctx.restore();}
    if(hero&&hero.blocked&&state==='play'){ctx.save();ctx.globalAlpha=.5+0.4*Math.sin(t*0.3);ctx.fillStyle='#ff6a6a';ctx.font='22px Georgia';ctx.textAlign='center';
      ctx.fillText(swaps>0?'⛔ смени сезона':'⛔ няма повече смени!',hero.x-cam,GROUND-276);ctx.restore();}
  }
  ctx.restore();
  if(endFlash>0){ctx.fillStyle='rgba(255,244,210,'+(endFlash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

/* ---------- телеметрия / автопилот за тест ---------- */
window.SG={
  get state(){return state;},
  get level(){return curLevel+1;},
  get levelIdx(){return curLevel;},
  get season(){return season;},
  get seasonName(){return SEASON.names[season];},
  get swaps(){return swaps;},
  get lives(){return lives;},
  get cd(){return +seasonCd.toFixed(3);},
  get hx(){return hero?Math.round(hero.x):-1;},
  get endX(){return L?L.endX:0;},
  get progress(){return L&&hero?+(hero.x/L.endX).toFixed(3):0;},
  get loaded(){return loaded;}, get failed(){return failed;}, get need(){return keys.length;},
  get booted(){return booted;},
  get numLevels(){return LEVELS.length;},
  info(i){const lv=LEVELS[i==null?curLevel:i];return {n:lv.n,name:lv.name,gates:lv.nGates,enemies:lv.nEnemies,hazards:lv.nHaz,obstacles:lv.obs.length,minSwaps:lv.minSwaps,swaps:lv.swaps,margin:lv.margin,endX:lv.endX,lives:lv.lives};},
  next(){const o=activeBarrier();return o?{kind:o.kind,type:o.type,x:Math.round(o.x),need:o.need,closed:barrierClosed(o),dead:!!o.dead}:null;},
  wildfire(){return L&&L.wildfire?{x:Math.round(L.wildfire.x==null?-999:L.wildfire.x),dist:hero?Math.round(hero.x-(L.wildfire.x||0)):0}:null;},
  hazards(){return L?L.hazards.map(h=>({kind:h.kind,danger:h.danger,in:hero?(hero.x>=h.x1&&hero.x<=h.x2):false,build:+(h.build||0).toFixed(2),max:h.max})):[];},
  // управление
  change(){changeSeason();return season;},
  hold(b){forward=!!b;},
  jump(){doJump();},
  begin(){press();},
  restart(){restartLevel();},
  jumpTo(i){ if(i<0||i>=LEVELS.length)return false; loadLevel(i); beginPlay(); forward=true; return true; }
};

/* ---------- цикъл ---------- */
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop);}
function boot(){ if(loaded<keys.length){setTimeout(boot,50);return;} loadLevel(0); state='title'; showTitle(); booted=true; requestAnimationFrame(ts=>{last=ts;loop(ts);}); }
boot();
</script>
