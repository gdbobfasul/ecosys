<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Core Descent — ръчна икона (подземни пластове, тунел надолу към светещо ядро, кирка). Ръчна (без служебния маркер) - генераторът я ПАЗИ и от нея прави магазинните PNG. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2415"/><stop offset="0.42" stop-color="#241812"/><stop offset="1" stop-color="#08060a"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2b0"/><stop offset="0.35" stop-color="#ffb43a"/><stop offset="0.72" stop-color="#ff6a1a"/><stop offset="1" stop-color="rgba(255,90,20,0)"/>
    </radialGradient>
    <radialGradient id="hi" cx="0.32" cy="0.2" r="0.9">
      <stop offset="0" stop-color="rgba(255,255,255,0.16)"/><stop offset="0.6" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="220"/></clipPath>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- пластове на земята (почва → скала → руда) -->
    <path d="M0 300 Q512 250 1024 300 V430 Q512 400 0 430 Z" fill="#5a3b22"/>
    <path d="M0 430 Q512 400 1024 430 V560 Q512 540 0 560 Z" fill="#4a3320"/>
    <path d="M0 560 Q512 540 1024 560 V690 Q512 680 0 690 Z" fill="#3a2a1e"/>
    <!-- рудни/кристални зрънца в пластовете -->
    <g fill="#ffd27a" opacity="0.85">
      <circle cx="220" cy="360" r="10"/><circle cx="760" cy="382" r="12"/><circle cx="410" cy="500" r="9"/>
      <circle cx="640" cy="620" r="11"/><circle cx="300" cy="640" r="8"/>
    </g>
    <g fill="#8fd3ff" opacity="0.7">
      <circle cx="820" cy="520" r="9"/><circle cx="180" cy="520" r="8"/><circle cx="540" cy="360" r="7"/>
    </g>

    <!-- тунел/шахта надолу към ядрото -->
    <path d="M452 300 L572 300 L556 560 L512 640 L468 560 Z" fill="#0d0a12" opacity="0.92"/>

    <!-- сияние на ядрото -->
    <circle cx="512" cy="770" r="230" fill="url(#core)"/>
    <!-- ядрото -->
    <circle cx="512" cy="770" r="118" fill="#ffcf5a"/>
    <circle cx="512" cy="770" r="118" fill="none" stroke="#ff7a1a" stroke-width="10"/>
    <circle cx="512" cy="770" r="60" fill="#fff4c2"/>
  </g>

  <rect width="1024" height="1024" rx="220" fill="url(#hi)"/>

  <!-- кирка (наклонена), над шахтата -->
  <g transform="rotate(-32 512 372)">
    <rect x="496" y="196" width="32" height="360" rx="14" fill="#a06a38"/>
    <rect x="496" y="196" width="32" height="360" rx="14" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="4"/>
    <path d="M300 210 Q512 128 724 210 Q560 178 512 214 Q464 178 300 210 Z" fill="#dfe6ee"/>
    <path d="M300 210 Q512 128 724 210 Q560 178 512 214 Q464 178 300 210 Z" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="4"/>
  </g>

  <text x="512" y="912" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="7" fill="rgba(255,255,255,0.96)" text-anchor="middle">pupikes</text>
</svg>
