<html lang="bg">
<head>
<script>/*RU-DEFAULT*/try{var L=localStorage;var K="servicestoolkit.lang";if(!L.getItem(K)){L.setItem(K,"ru");}if(!L.getItem("fps.lang")){L.setItem("fps.lang","ru");L.setItem("lang","ru");L.setItem("pupikes-langgate","ru");}L.setItem("pupikes.langgate.reloaded_at",String(Date.now()));}catch(e){}try{window.__PUPIKES_LANGGATE_OFF__=true;}catch(e){}</script>

</head>

<!--I18N_START--><script>(function(){var T={};
function L(){try{return localStorage.getItem('fps.lang')||localStorage.getItem('lang')||'bg';}catch(e){return 'bg';}}
function pick(k){var e=T[k];if(!e)return null;var l=L();if(l==='bg')return null;return e[l]||null;}
function inGate(n){for(var p=n;p;p=p.parentNode){if(p.id==='pupikes-langgate')return true;}return false;}
var busy=false;
function tnode(n){var v=n.nodeValue;if(!v||!/[А-Яа-яЁё]/.test(v)||inGate(n))return;var k=v.replace(/\s+/g,' ').trim();var t=pick(k);if(t&&t!==k){n.nodeValue=v.replace(k,t);}}
function walk(n){if(!n)return;if(n.nodeType===3){tnode(n);return;}if(n.nodeType!==1)return;var tg=n.tagName;if(tg==='SCRIPT'||tg==='STYLE'||n.id==='pupikes-langgate')return;
['placeholder','title','aria-label','alt','value'].forEach(function(a){if(n.hasAttribute&&n.hasAttribute(a)){var av=n.getAttribute(a);if(av&&/[А-Яа-яЁё]/.test(av)){var t=pick(av.replace(/\s+/g,' ').trim());if(t)n.setAttribute(a,t);}}});
for(var c=n.firstChild;c;c=c.nextSibling)walk(c);}
function apply(){if(L()==='bg')return;try{mo&&mo.disconnect();}catch(e){}try{if(document.body)walk(document.body);}catch(e){}reobs();}
var OBS={childList:true,subtree:true,characterData:true};
function reobs(){try{mo&&mo.observe(document.documentElement,OBS);}catch(e){}}
var mo=new MutationObserver(function(ms){if(L()==='bg')return;try{mo.disconnect();}catch(e){}
try{for(var i=0;i<ms.length;i++){var m=ms[i];if(m.type==='childList'){for(var j=0;j<m.addedNodes.length;j++)walk(m.addedNodes[j]);}else if(m.type==='characterData'){tnode(m.target);}}}catch(e){}
reobs();});
if(document.readyState!=='loading')apply();document.addEventListener('DOMContentLoaded',apply);window.addEventListener('load',apply);reobs();
var _last=L();setInterval(function(){var c=L();if(c!==_last){_last=c;apply();}},700);
})();</script><!--I18N_END--></body>
