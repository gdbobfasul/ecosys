<!doctype html>
<!-- Version: 1.0001 -->
<html lang="bg">
<head>
<script>/*RU-DEFAULT*/try{var L=localStorage;var K="plane.lang";if(!L.getItem(K)){L.setItem(K,"ru");}if(!L.getItem("fps.lang")){L.setItem("fps.lang","ru");L.setItem("lang","ru");L.setItem("pupikes-langgate","ru");}L.setItem("pupikes.langgate.reloaded_at",String(Date.now()));}catch(e){}try{window.__PUPIKES_LANGGATE_OFF__=true;}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Warbird Rush</title>
  <style>
    /* Цял екран, без скрол, тъмен фон зад canvas-а */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05060f;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Зареждащ надпис докато Phaser стартира */
    #boot-hint {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6cf;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot-hint">ЗАРЕЖДАНЕ…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
