<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Shadowbound (Сянката) — ръчна икона: човек + удължена сянка под ниска светлина.
       Ръчна (БЕЗ служебния маркер) → генераторът я ПАЗИ и от нея прави магазинните PNG. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a2e"/><stop offset="0.55" stop-color="#0a0c16"/><stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.32" cy="0.22" r="0.9">
      <stop offset="0" stop-color="rgba(255,255,255,0.16)"/><stop offset="0.6" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- ниска топла светлина, която хвърля сянката -->
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(235,215,150,0.85)"/><stop offset="0.5" stop-color="rgba(216,193,122,0.28)"/><stop offset="1" stop-color="rgba(216,193,122,0)"/>
    </radialGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(4,5,10,0.95)"/><stop offset="1" stop-color="rgba(10,12,24,0.15)"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#hi)"/>

  <!-- шевът: линията на светлината между двата свята -->
  <rect x="0" y="470" width="1024" height="8" fill="rgba(235,215,150,0.55)"/>
  <ellipse cx="392" cy="474" rx="300" ry="60" fill="url(#light)"/>

  <!-- РЕАЛНИЯТ човек (стои на линията на светлината) -->
  <g fill="#e7d9a6">
    <circle cx="392" cy="300" r="52"/>
    <path d="M392 356 c-46 0 -74 34 -74 92 v96 h44 v-70 h10 v70 h40 v-70 h10 v70 h44 v-96 c0 -58 -28 -92 -74 -92 z"/>
  </g>

  <!-- УДЪЛЖЕНАТА сянка (сплесната, наклонена напред-надолу от ниската светлина) -->
  <g transform="translate(392 486) skewX(52)" opacity="0.92">
    <ellipse cx="0" cy="330" rx="150" ry="26" fill="rgba(4,5,10,0.55)"/>
    <g fill="url(#shadow)">
      <circle cx="0" cy="150" r="46"/>
      <path d="M0 196 c-40 0 -66 30 -66 82 v96 h40 v-64 h8 v64 h36 v-64 h8 v64 h40 v-96 c0 -52 -26 -82 -66 -82 z"/>
    </g>
  </g>

  <!-- нишката-връзка между стъпалата на човека и сянката -->
  <path d="M392 540 L392 500" stroke="rgba(235,215,150,0.7)" stroke-width="6" stroke-linecap="round"/>

  <text x="512" y="906" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="7" fill="rgba(255,255,255,0.96)" text-anchor="middle">pupikes</text>
</svg>
