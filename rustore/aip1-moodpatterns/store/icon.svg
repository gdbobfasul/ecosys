<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ръчна икона за Mood Patterns: спокоен градиент (настроение), бяла плочка с
       крива на настроението във времето + цветни точки-настроения и мек сърце-пулс. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a7df0"/><stop offset="1" stop-color="#57c9b6"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.32" cy="0.24" r="0.9">
      <stop offset="0" stop-color="rgba(255,255,255,0.22)"/><stop offset="0.6" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7df0"/><stop offset="0.5" stop-color="#6aa9e0"/><stop offset="1" stop-color="#57c9b6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#g)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#hi)"/>
  <!-- бяла плочка (карта на настроението) -->
  <rect x="196" y="266" width="632" height="452" rx="70" fill="#ffffff"/>
  <!-- спокойни хоризонтали (мрежа на графиката) -->
  <g stroke="rgba(138,125,240,0.16)" stroke-width="6">
    <line x1="252" y1="392" x2="772" y2="392"/>
    <line x1="252" y1="492" x2="772" y2="492"/>
    <line x1="252" y1="592" x2="772" y2="592"/>
  </g>
  <!-- крива на настроението във времето -->
  <path d="M252 600 C 340 470, 396 470, 468 540 C 540 610, 604 372, 700 404 C 742 418, 762 402, 772 396"
        fill="none" stroke="url(#wave)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- цветни точки-настроения по кривата -->
  <circle cx="252" cy="600" r="26" fill="#e4788f"/>
  <circle cx="468" cy="540" r="26" fill="#e8a54a"/>
  <circle cx="700" cy="404" r="28" fill="#57c9b6"/>
  <!-- мек сърце-пулс акцент долу-дясно на плочката -->
  <path d="M636 636 c -22 -26 -64 -12 -64 22 c 0 30 40 52 64 74 c 24 -22 64 -44 64 -74 c 0 -34 -42 -48 -64 -22 z"
        fill="rgba(228,120,143,0.9)"/>
  <text x="512" y="892" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="118" font-weight="700" letter-spacing="7" fill="rgba(255,255,255,0.96)" text-anchor="middle">pupikes</text>
</svg>
