<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Legacy Keeper — ръчна икона. Мотив: писмо-наследство (сгънат документ със златен печат),
       свещ-пламък (памет) и гълъб (мир/предаване на желанията). Ръчна (БЕЗ служебния маркер) —
       генераторът я ПАЗИ и от нея прави магазинните PNG. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8a36a"/><stop offset="0.5" stop-color="#a07b4f"/><stop offset="1" stop-color="#5f4a32"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#f2e7cf"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe28a"/><stop offset="0.5" stop-color="#ffb43b"/><stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.32" cy="0.22" r="0.95">
      <stop offset="0" stop-color="rgba(255,255,255,0.22)"/><stop offset="0.6" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#hi)"/>

  <!-- писмо / сгънат документ (наследство) -->
  <g>
    <rect x="300" y="392" width="424" height="356" rx="26" fill="url(#paper)"/>
    <rect x="300" y="392" width="424" height="356" rx="26" fill="none" stroke="rgba(90,70,40,0.28)" stroke-width="6"/>
    <!-- редове текст (последни желания) -->
    <g fill="rgba(120,95,55,0.55)">
      <rect x="348" y="452" width="328" height="22" rx="11"/>
      <rect x="348" y="502" width="328" height="22" rx="11"/>
      <rect x="348" y="552" width="240" height="22" rx="11"/>
    </g>
    <!-- златен восъчен печат -->
    <circle cx="512" cy="662" r="52" fill="#b8945f"/>
    <circle cx="512" cy="662" r="52" fill="none" stroke="#8a6d4b" stroke-width="6"/>
    <path d="M512 636 c-18 0 -30 14 -30 28 c0 20 30 40 30 40 s30 -20 30 -40 c0 -14 -12 -28 -30 -28z" fill="#fff6e2"/>
  </g>

  <!-- свещ-пламък (памет) над печата на писмото, вдясно горе -->
  <g transform="translate(700 300)">
    <path d="M0 -70 C 34 -30 40 6 12 34 C -6 52 -34 46 -40 18 C -44 -2 -22 -30 -14 -54 C -8 -34 4 -30 0 -70z" fill="url(#flame)"/>
    <ellipse cx="-6" cy="6" rx="14" ry="24" fill="rgba(255,255,255,0.75)"/>
  </g>

  <!-- гълъб (мир / предаване на желанията) горе вляво -->
  <g fill="#fffdf6" transform="translate(322 300)">
    <path d="M-58 20 C -30 -18 22 -34 66 -14 C 42 -6 30 8 34 30 C 8 26 -22 34 -46 52 C -60 44 -66 32 -58 20z"/>
    <!-- крило -->
    <path d="M-6 6 C 18 -14 46 -18 70 -30 C 58 -2 42 18 12 22 C 2 18 -6 12 -6 6z" fill="#efe4d2"/>
    <!-- глава/клюн -->
    <circle cx="58" cy="-12" r="4" fill="#5f4a32"/>
  </g>
</svg>
