<!DOCTYPE html>
<!-- Version: 1.0001 -->
<!-- pupikes.app — каталог на екосистемата Pupikes. Data-driven от catalog.json
     (мастер: app-shared/pupikes-catalog.json; деплоят го копира тук като catalog.json).
     Показва САМО приложения с show:true, групирани по семейства. Готовите се свалят
     директно (download:true → /apk/<файл>), останалите APK-та в /apk са зад парола (nginx).
     ?preview=1 → показва ВСИЧКИ (за собственика, за преглед преди публикуване). -->
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pupikes — екосистема от приложения</title>
<style>
  :root{ --bg:#0f1115; --card:#181b22; --ink:#eef1f6; --dim:#9aa4b2; --acc:#ffb703; --acc2:#8ecae6; --line:#252a33; }
  @media (prefers-color-scheme:light){ :root{ --bg:#f6f7fa; --card:#fff; --ink:#1a1d24; --dim:#5c6672; --acc:#e08a00; --acc2:#2a7fa6; --line:#e6e9ef; } }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 18px 80px}
  header.hero{text-align:center;padding:34px 12px 10px}
  .logo{font-size:44px;font-weight:800;letter-spacing:-1px;margin:0}
  .logo .paw{color:var(--acc)}
  .tagline{color:var(--dim);margin:8px 0 0;font-size:17px}
  .short{display:inline-block;margin-top:12px;font-size:13px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
  .group{margin:34px 0 0}
  .group h2{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
  .group .gnote{color:var(--dim);font-size:14px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .card h3{margin:0;font-size:16px}
  .card .hd{display:flex;align-items:center;gap:12px}
  .card .ic{width:50px;height:50px;border-radius:13px;flex:0 0 auto;background:var(--line);object-fit:cover}
  .card .legal{margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
  .card .legal a{color:var(--dim);font-size:12px;text-decoration:underline}
  .card .legal a.bad{color:#ff6b6b;font-weight:700}
  .card .legal .warn{margin-left:3px;color:#ff3b30;font-weight:800;text-decoration:none}
  .card .hd .stat{margin-left:6px;font-size:13px;opacity:.45;cursor:default}
  .card .hd .stat.bad{opacity:1;color:#ff3b30}
  .card .hd .stat.ok{opacity:.8;color:#59c26b}
  .price{font-weight:800;color:var(--acc);font-size:15px;margin:-2px 0 2px}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .b{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .b.hw{border-color:#c1272d55;color:#e0616a} .b.ru{border-color:#0a84ff55;color:#5aa9ff}
  .b.soon{opacity:.7}
  .actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
  a.btn{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;padding:9px 10px;border-radius:10px;border:1px solid var(--line);color:var(--ink);background:transparent}
  a.btn.dl{background:var(--acc);color:#1a1d24;border-color:var(--acc)}
  a.btn.store{color:var(--acc2);border-color:var(--acc2)}
  .empty{text-align:center;color:var(--dim);padding:60px 20px}
  .preview-note{text-align:center;background:#ffb70322;border:1px solid var(--acc);border-radius:10px;padding:10px;margin:18px 0;font-size:14px}
  footer{text-align:center;color:var(--dim);font-size:13px;margin-top:50px;border-top:1px solid var(--line);padding-top:22px}
  .langbar{text-align:right;margin:2px 0 -20px}
  .langbar select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:14px system-ui;cursor:pointer}
  html[dir=rtl] .langbar{text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar"><select id="langsel" aria-label="Language / Език"></select></div>
  <header class="hero">

150 168, 205 92, 205 6 C 205 -92, 120 -160, 0 -160 Z" fill="url(#padMain)"/></g></g></svg></span>Pupikes</h1>
    <p class="tagline" id="tagline">Приложения, които ти служат вярно.</p>
    <span class="short" id="short">Екосистема от приложения</span>
    <div class="appver" id="appver" style="margin-top:8px;font-size:13px;opacity:.7;font-weight:700;letter-spacing:.3px">—</div>
  </header>
  <div id="preview" class="preview-note" style="display:none">👁 Режим за преглед — показани са ВСИЧКИ приложения (вкл. непубликуваните). Публично се виждат само тези с включен флаг.</div>
  <main id="catalog"><div class="empty">Зареждам каталога…</div></main>
  <footer>
    <div>🐾 <b>Pupikes</b> — <span id="ftag">верни приложения</span></div>
    <div style="margin-top:6px" id="counts"></div>
  </footer>
</div>

    stores:{bg:'в магазините',ru:'в магазинах',uk:'у магазинах',en:'in stores',de:'in Stores',fr:'en magasins',es:'en tiendas','es-MX':'en tiendas',it:'negli store',pt:'nas lojas',ar:'في المتاجر',hi:'स्टोर में',ja:'ストアに',ky:'дүкөндөрдө','zh-Hant':'在商店'},
    ftag:{bg:'верни приложения',ru:'верные приложения',uk:'вірні застосунки',en:'faithful apps',de:'treue Apps',fr:'applis fidèles',es:'apps fieles','es-MX':'apps fieles',it:'app fedeli',pt:'apps fiéis',ar:'تطبيقات مخلصة',hi:'वफ़ादार ऐप्स',ja:'忠実なアプリ',ky:'ишенимдүү колдонмолор','zh-Hant':'忠實的應用'},
    empty:{bg:'Още няма публикувани приложения тук.',ru:'Здесь пока нет опубликованных приложений.',en:'No published apps here yet.',uk:'Тут ще немає опублікованих застосунків.',de:'Noch keine veröffentlichten Apps.',fr:'Pas encore d’applis publiées ici.',es:'Aún no hay apps publicadas aquí.','es-MX':'Aún no hay apps publicadas aquí.',it:'Nessuna app pubblicata qui ancora.',pt:'Ainda sem apps publicadas aqui.',ar:'لا تطبيقات منشورة هنا بعد.',hi:'यहाँ अभी कोई प्रकाशित ऐप नहीं।',ja:'まだ公開アプリはありません。',ky:'Бул жерде азырынча жарыяланган колдонмо жок.','zh-Hant':'這裡尚無已發佈的應用。'},
    preview_note:{bg:'👁 Режим за преглед — показани са ВСИЧКИ приложения (вкл. непубликуваните).',ru:'👁 Режим предпросмотра — показаны ВСЕ приложения.',en:'👁 Preview mode — ALL apps shown (incl. unpublished).'},
    priv:{bg:'Поверителност',ru:'Конфиденциальность',uk:'Конфіденційність',en:'Privacy',de:'Datenschutz',fr:'Confidentialité',es:'Privacidad','es-MX':'Privacidad',it:'Privacy',pt:'Privacidade',ar:'الخصوصية',hi:'गोपनीयता',ja:'プライバシー',ky:'Купуялык','zh-Hant':'隱私權'},

    doc_missing:{bg:'Липсва документ — има проблем',ru:'Документ отсутствует — есть проблема',uk:'Документ відсутній — є проблема',en:'Document missing — there is a problem',de:'Dokument fehlt — es gibt ein Problem',fr:'Document manquant — il y a un problème',es:'Falta el documento — hay un problema','es-MX':'Falta el documento — hay un problema',it:'Documento mancante — c’è un problema',pt:'Documento em falta — há um problema',ar:'المستند مفقود — هناك مشكلة',hi:'दस्तावेज़ गायब — समस्या है',ja:'書類がありません — 問題があります',ky:'Документ жок — көйгөй бар','zh-Hant':'缺少文件 — 有問題'},
    icon_missing:{bg:'Липсва иконата на приложението (на сървъра)',ru:'Отсутствует иконка приложения (на сервере)',uk:'Відсутня іконка застосунку (на сервері)',en:'App icon missing (on server)',de:'App-Icon fehlt (auf dem Server)',fr:'Icône de l’app manquante (sur le serveur)',es:'Falta el icono de la app (en el servidor)','es-MX':'Falta el icono de la app (en el servidor)',it:'Icona dell’app mancante (sul server)',pt:'Ícone do app em falta (no servidor)',ar:'أيقونة التطبيق مفقودة (على الخادم)',hi:'ऐप आइकन गायब (सर्वर पर)',ja:'アプリのアイコンがありません（サーバー）',ky:'Колдонмонун иконкасы жок (серверде)','zh-Hant':'缺少應用圖示（伺服器）'},
    st_docs:{bg:'Документи и икона (сървър)',ru:'Документы и иконка (сервер)',uk:'Документи та іконка (сервер)',en:'Documents & icon (server)',de:'Dokumente & Icon (Server)',fr:'Documents et icône (serveur)',es:'Documentos e icono (servidor)','es-MX':'Documentos e icono (servidor)',it:'Documenti e icona (server)',pt:'Documentos e ícone (servidor)',ar:'المستندات والأيقونة (الخادم)',hi:'दस्तावेज़ और आइकन (सर्वर)',ja:'書類とアイコン（サーバー）',ky:'Документтер жана иконка (сервер)','zh-Hant':'文件與圖示（伺服器）'},
    st_svc:{bg:'Сървиз на приложението',ru:'Сервис приложения',uk:'Сервіс застосунку',en:'App service',de:'App-Dienst',fr:'Service de l’app',es:'Servicio de la app','es-MX':'Servicio de la app',it:'Servizio dell’app',pt:'Serviço do app',ar:'خدمة التطبيق',hi:'ऐप सेवा',ja:'アプリのサービス',ky:'Колдонмонун сервиси','zh-Hant':'應用服務'},
    svc_down:{bg:'Сървизът не отговаря / не е пуснат',ru:'Сервис не отвечает / не запущен',uk:'Сервіс не відповідає / не запущено',en:'Service not responding / not running',de:'Dienst antwortet nicht / läuft nicht',fr:'Service ne répond pas / non lancé',es:'El servicio no responde / no iniciado','es-MX':'El servicio no responde / no iniciado',it:'Servizio non risponde / non avviato',pt:'Serviço não responde / não iniciado',ar:'الخدمة لا تستجيب / غير مشغّلة',hi:'सेवा उत्तर नहीं दे रही / नहीं चल रही',ja:'サービスが応答しません／未起動',ky:'Сервис жооп бербейт / иштебей жатат','zh-Hant':'服務無回應／未執行'}
  };
  // Сървиси по приложение — от services.json (ЕДИНСТВЕН източник; същия четат админ страницата
  // и check-all-app-services.mjs). SVCMAP: appId → [{name,url,deployed}]. Показва ⚙ на всеки ап
  // с реален бекенд; ❗ ако е долу, ⏳ ако още не е пуснат.
  var SVCMAP = {};
  function buildSvcMap(sj){
    SVCMAP={};
    var DOM=((sj&&sj.domain)||'').replace(/\/+$/,'');   // домейнът е на ЕДНО място в services.json
    var arr=(sj&&sj.services)||[];
    arr.forEach(function(s){
      if(s.perApp===false) return;
      var url=s.healthUrl||(DOM+(s.healthPath||''));   // URL = domain + healthPath
      (s.apps||[]).forEach(function(app){
        if(!/^[a-z0-9\-]+$/i.test(app)) return;
        (SVCMAP[app]=SVCMAP[app]||[]).push({name:s.name,url:url,deployed:s.deployed!==false});
      });
    });
  }
  var lang = (function(){ try{ var s=localStorage.getItem('pupikes.catalog.lang'); if(s) return s; }catch(e){} var n=(navigator.language||'bg'); for(var i=0;i<LANGS.length;i++){ if(LANGS[i][0]===n) return n; } var two=n.slice(0,2); for(var j=0;j<LANGS.length;j++){ if(LANGS[j][0].slice(0,2)===two) return LANGS[j][0]; } return 'bg'; })();
  function t(k){ var o=T[k]||{}; return o[lang]||o[lang.split('-')[0]]||o.en||o.bg||k; }
  function L(o){ return o && (o[lang]||o[lang.split('-')[0]]||o.bg||o.en||'') || ''; }
  var cat=null;
  var sel=document.getElementById('langsel');
  sel.innerHTML=LANGS.map(function(l){return '<option value="'+l[0]+'"'+(l[0]===lang?' selected':'')+'>'+l[1]+'</option>';}).join('');
  sel.onchange=function(){ lang=sel.value; try{localStorage.setItem('pupikes.catalog.lang',lang);}catch(e){} applyDir(); render(); };
  function applyDir(){ document.documentElement.lang=lang; document.documentElement.dir=(lang==='ar'?'rtl':'ltr'); }
  applyDir();

  function render(){
    var host=document.getElementById('catalog');
    document.getElementById('preview').textContent = t('preview_note');
    document.getElementById('preview').style.display = preview ? 'block' : 'none';
    if(cat && cat.brand){ document.getElementById('tagline').textContent = L(cat.brand.tagline)||t('tagline'); document.getElementById('short').textContent = t('eco')+' · '+cat.brand.short; document.getElementById('ftag').textContent = t('ftag'); }
    else { document.getElementById('tagline').textContent = t('tagline'); document.getElementById('ftag').textContent = t('ftag'); }
    if(!cat){ host.innerHTML='<div class="empty">'+t('loading')+'</div>'; return; }
    var shownTotal=0, pubTotal=0, __n=0; host.innerHTML='';
    (cat.groups||[]).forEach(function(g){
      var apps=(g.apps||[]).filter(function(a){ return preview || a.show; });
      apps.forEach(function(a){ if(a.published && (a.published.huawei||a.published.rustore)) pubTotal++; });
      if(!apps.length) return;
      shownTotal += apps.length;
      var sec=document.createElement('section'); sec.className='group';
      sec.innerHTML='<h2>'+L(g.title)+'</h2>'+(L(g.note)?'<p class="gnote">'+L(g.note)+'</p>':'');
      var grid=document.createElement('div'); grid.className='grid';
      apps.forEach(function(a){
        var pub=a.published||{}; var badges='';
        badges += pub.huawei ? '<span class="b hw">Huawei ✓</span>' : '<span class="b hw soon">Huawei '+t('soon_w')+'</span>';
        badges += pub.rustore ? '<span class="b ru">RuStore ✓</span>' : '<span class="b ru soon">RuStore '+t('soon_w')+'</span>';
        var acts='';
        if(a.download && a.apk && a.apk.rustore) acts+='<a class="btn dl" href="/'+a.apk.rustore+'">'+t('dl')+'</a>';
        if(pub.huawei && a.storeUrl && a.storeUrl.huawei) acts+='<a class="btn store" href="'+a.storeUrl.huawei+'">AppGallery</a>';
        if(pub.rustore && a.storeUrl && a.storeUrl.rustore) acts+='<a class="btn store" href="'+a.storeUrl.rustore+'">RuStore</a>';
        if(!acts) acts='<span class="b soon">'+t('soon')+'</span>';
        // Задължителни правни документи — конкретни за ТОВА приложение (папка = a.id).
        // hw-* когато има Huawei издание, иначе rustore-*; сервира се от pupikes.app/privacy/.
        var lid=a.id||''; var _hw=!!(a.apk&&a.apk.huawei);
        var _pf=_hw?'hw-privacy.html':'rustore-privacy.html', _tf=_hw?'hw-terms.html':'rustore-terms.html';
        var legal=lid?('<div class="legal">'+
          '<a class="lg" data-lg href="/privacy/'+lid+'/'+_pf+'">'+t('priv')+'</a>'+
          '<a class="lg" data-lg href="/privacy/'+lid+'/'+_tf+'">'+t('terms')+'</a></div>'):'';
        var _iv=(cat&&(cat.updated||cat.version))?encodeURIComponent(cat.updated||cat.version):'1';
        var icon=lid?'<img class="ic" src="/icons/'+lid+'.png?v='+_iv+'" alt="" loading="lazy" onerror="this.style.display=\'none\';var c=this.closest(\'.card\');if(window.markStat)window.markStat(c,\'.sdoc\',\'icon\');">':'';
        // Две ❗-полета: 📄 = документи/икона на сървъра; ⚙ = сървизът(ите) на приложението.
        // Няма ❗ = наред. По един ⚙ за всеки бекенд сървиз на този ап (от SVCMAP).
        var svcs=SVCMAP[lid]||[];
        var stat='<span class="stat sdoc" title="'+t('st_docs')+'">📄</span>'+
          svcs.map(function(s){ return '<span class="stat ssvc" data-svc="'+s.url+'" data-deployed="'+(s.deployed?'1':'0')+'" title="'+t('st_svc')+': '+String(s.name||'').replace(/"/g,'')+'">⚙</span>'; }).join('');
        var card=document.createElement('div'); card.className='card';
        card.innerHTML='<div class="hd">'+icon+'<h3><span class="num">'+(++__n)+'.</span> '+a.name+'</h3>'+stat+'</div>'+(a.price?'<div class="price">'+a.price+'</div>':'')+'<div class="badges">'+badges+'</div><div class="actions">'+acts+'</div>'+legal;
        grid.appendChild(card);
      });
      sec.appendChild(grid); host.appendChild(sec);
    });
    if(!shownTotal) host.innerHTML='<div class="empty">'+t('empty')+' 🐾</div>';
    document.getElementById('counts').textContent = shownTotal+' '+t('apps')+' · '+pubTotal+' '+t('stores')+(preview?' ('+t('soon_w')+')':'');
    verifyLegal(); verifyServices();
  }

  // Card-level статус: слага ❗ на 📄 (документи/икона) или ⚙ (сървиз) при проблем.
  function markStat(card, sel, reason){
    var el = card && card.querySelector(sel);
    if(!el || el.getAttribute('data-checked')==='bad') return;
    el.setAttribute('data-checked','bad'); el.classList.add('bad');
    el.title = (sel.indexOf('svc')>=0 ? t('svc_down') : (reason==='icon' ? t('icon_missing') : t('doc_missing')));
    if(el.textContent.indexOf('❗')<0) el.textContent = el.textContent + '❗';
  }
  window.markStat = markStat; // за inline onerror на иконата

  // Жива проверка: всеки правен документ (под-линк) трябва да връща 200; иначе ❗ (линк + 📄).
  function markBad(el){
    if(el.getAttribute('data-checked')==='bad') return;
    el.setAttribute('data-checked','bad'); el.classList.add('bad');
    if(!el.querySelector('.warn')){ var w=document.createElement('span'); w.className='warn'; w.textContent='❗'; w.title=t('doc_missing'); el.appendChild(w); }
    var c=el.closest('.card'); if(c) markStat(c,'.sdoc');
  }
  function verifyLegal(){
    var links=document.querySelectorAll('#catalog a[data-lg]');
    Array.prototype.forEach.call(links,function(el){
      var url=el.getAttribute('href');
      fetch(url,{method:'HEAD',cache:'no-store'}).then(function(r){
        if(r.ok){ el.setAttribute('data-checked','ok'); } else { markBad(el); }
      }).catch(function(){ markBad(el); });
    });
  }
  // Сървиз на приложението: health URL връща истински JSON → ⚙ зелено; долу → ❗ (ако се очаква да
  // работи), ⏳ (ако още не е деплойнат). Маркира КОНКРЕТНИЯ ⚙ (един ап може да има няколко сървиза).
  function verifyServices(){
    var svc=document.querySelectorAll('#catalog .ssvc[data-svc]');
    Array.prototype.forEach.call(svc,function(el){
      var url=el.getAttribute('data-svc');
      var deployed=el.getAttribute('data-deployed')!=='0';
      function down(){
        if(el.getAttribute('data-checked')==='bad') return;
        el.setAttribute('data-checked','bad'); el.classList.add('bad'); el.title=t('svc_down');
        if(deployed){ if(el.textContent.indexOf('❗')<0) el.textContent=el.textContent+'❗'; }
        else { el.textContent='⏳'; }
      }
      fetch(url,{method:'GET',cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(b){
        if(/^\s*\{/.test(b)){ el.classList.add('ok'); el.setAttribute('data-checked','ok'); } else { down(); }
      }).catch(function(){ down(); });
    });
  }

  render(); // първоначален изглед (loading)
  // Списъкът със сървиси (един източник) — щом дойде, преначертаваме, за да излязат ⚙-тата.
  fetch('services.json?v='+Date.now()).then(function(r){return r.json();}).then(function(j){ buildSvcMap(j); if(cat) render(); }).catch(function(){});
  fetch('catalog.json?v='+Date.now()).then(function(r){return r.json();}).then(function(j){ cat=j; try{ if(j.version){ var _v=document.getElementById('appver'); if(_v) _v.textContent='v'+j.version+' · '+({bg:'текуща версия',ru:'текущая версия',uk:'поточна версія',en:'current version',de:'aktuelle Version',fr:'version actuelle',es:'versión actual','es-MX':'versión actual',it:'versione attuale',pt:'versão atual',ar:'الإصدار الحالي',hi:'मौजूदा संस्करण',ja:'現在のバージョン',ky:'учурдагы версия','zh-Hant':'目前版本'}[lang]||'current version'); } }catch(e){} render(); }).catch(function(){ document.getElementById('catalog').innerHTML='<div class="empty">'+t('load_err')+'</div>'; });
})();
</script>
</body>
</html>
